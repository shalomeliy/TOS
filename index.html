<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOS Trainer</title>
<style>
:root{
  --face:#d4d0c8; --face-lt:#e6e3dc; --hl:#ffffff; --shadow:#808080; --dark:#404040;
  --title1:#0a246a; --title2:#3a6ea5; --sel:#316ac5; --ink:#000; --muted:#555;
  --exp:#3f8f5a; --imp:#c0702e; --mty:#8a8a8a; --hold:#c0262d; --win:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#3a6ea5;font:12px Tahoma,"Segoe UI",Verdana,sans-serif;color:var(--ink)}
.app{position:absolute;inset:6px;display:grid;grid-template-rows:auto auto auto 1fr auto auto;grid-template-columns:minmax(0,1fr);background:var(--face);
  border:1px solid;border-color:var(--hl) var(--dark) var(--dark) var(--hl);box-shadow:inset -1px -1px var(--shadow)}
.titlebar{display:flex;align-items:center;gap:6px;padding:3px 4px;color:#fff;font-weight:bold;
  background:linear-gradient(90deg,var(--title1),var(--title2))}
.titlebar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{width:16px;height:14px;background:var(--face);color:#000;font:bold 9px Tahoma;display:grid;place-items:center;
  border:1px solid;border-color:var(--hl) var(--dark) var(--dark) var(--hl)}
.menubar{display:flex;gap:2px;padding:2px 4px;border-bottom:1px solid var(--shadow)}
.menubar a{padding:2px 6px;color:#000;text-decoration:none;cursor:pointer}
.menubar a:hover{background:var(--sel);color:#fff}
.menubar a u{text-decoration:underline}
#tip{position:fixed;z-index:10;max-width:280px;direction:rtl;text-align:right;background:#ffffe1;color:#000;border:1px solid #000;
  padding:4px 7px;font-size:12px;line-height:1.45;box-shadow:2px 2px 0 #0004;pointer-events:none}
#tip[hidden]{display:none}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px;border-bottom:1px solid var(--shadow);box-shadow:0 1px var(--hl)}
.sep{width:2px;height:20px;border-left:1px solid var(--shadow);border-right:1px solid var(--hl);margin:0 3px}
button{font:inherit;background:var(--face);padding:3px 10px;cursor:pointer;color:#000;
  border:1px solid;border-color:var(--hl) var(--dark) var(--dark) var(--hl);box-shadow:inset -1px -1px var(--shadow)}
button:active,button.on{border-color:var(--dark) var(--hl) var(--hl) var(--dark);box-shadow:inset 1px 1px var(--shadow)}
button:disabled{color:var(--shadow);text-shadow:1px 1px var(--hl);cursor:default}
button.sm{padding:1px 6px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:1px dotted #000;outline-offset:1px}
input,select{font:inherit;background:#fff;padding:2px 3px;border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow);box-shadow:inset 1px 1px var(--dark)}
.clock{font-family:"Lucida Console",Consolas,monospace;padding:2px 8px;background:#000;color:#3f3}
.pstate{padding:1px 6px;border:1px solid #0006;font-weight:bold;white-space:nowrap}
.ps-WORKING{background:#d4efd4}.ps-GATE-CLOSED{background:#fff3c4}.ps-SHABBAT{background:#e3d6f5}
.st-SHABBAT{background:#e3d6f5}
.layout{overflow-x:auto;display:grid;gap:4px;padding-bottom:4px}
.layout>div{min-width:max-content}
.sea{background:#9cc3e6;color:#1d3e63;padding:2px 6px}
.quays{display:flex;gap:6px}
.quay{flex:none;background:#cfd8e3;border:1px solid #7f8fa3;padding:3px 6px}
.lane{display:flex;flex-wrap:wrap;gap:4px 16px;background:#eee;border:1px dashed #999;padding:3px 6px}
.lblocks{display:flex;gap:6px}
.lblock{background:#fff;border:1px solid #bbb;padding:3px 6px;min-width:150px}
.rail{border-top:4px double #555;padding-top:2px;color:var(--muted)}
.stowwrap{display:grid;grid-template-columns:auto minmax(0,300px);gap:12px;align-items:start}
.baywrap{overflow-x:auto;min-width:0}
.baygrid{display:grid;gap:3px;background:#fff;padding:6px;border:1px solid #bbb;width:max-content}
.rowlbl,.tierlbl{font-size:10px;color:var(--muted);align-self:center;text-align:center}
.hatch{grid-column:1/-1;border-top:5px solid #333;margin:2px 0}
button.slot{height:42px;padding:1px;font-size:10px;line-height:1.25;background:#f7f7f7;box-shadow:none;border:1px solid #ccc}
button.slot.planned{border:2px dashed #333}
button.slot.on{border:2px solid #000}
button.slot.warn{border:3px solid var(--hold);font-weight:bold}
button.slot.cur{outline:2px solid var(--sel);outline-offset:1px}
.pod1,button.slot.pod1{background:#dcebfb}.pod2,button.slot.pod2{background:#8fbbe8}.pod3,button.slot.pod3{background:#2f6db0;color:#fff}
button.slot.planned{background-image:repeating-linear-gradient(45deg,#fff8 0 4px,transparent 4px 8px)}
button.slot.impslot{background:var(--imp);color:#fff}
.legend i.lg-planned{border:2px dashed #333;background:#fff}.legend i.lg-on{border:2px solid #000;background:#fff}.legend i.lg-warn{border:2px solid var(--hold);background:#fff}
.main{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:0;gap:4px;padding:4px}
.sunken{background:var(--win);border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow);box-shadow:inset 1px 1px var(--dark)}
nav{overflow:auto;padding:4px 2px}
nav .grp{margin:2px 0 0 0;padding:2px 4px;font-weight:bold}
nav .grp::before{content:"\25BE  ";font-size:9px}
nav a{display:block;padding:1px 4px 1px 22px;color:#000;text-decoration:none;cursor:pointer;white-space:nowrap}
nav a::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;background:var(--face);border:1px solid var(--shadow)}
nav a.cur{background:var(--sel);color:#fff}
.content{overflow:auto;padding:8px 10px;min-width:0}
h1{font-size:15px;margin:0 0 2px;cursor:help}
th,.tag,legend,.kpi,.legend span,h3,.quay,.sea,.rail,.lane>span,.eqname,.pstatus{cursor:help}
h1 .q{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;font-size:11px;border:1px solid var(--shadow);border-radius:50%;background:var(--win);color:var(--muted)}
.concept{color:var(--muted);margin-bottom:6px}
.help{direction:rtl;text-align:right;background:#ffffe1;border:1px solid #a0a070;padding:5px 8px;margin:6px 0 10px;line-height:1.5}
fieldset{border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow);margin:0 0 10px;padding:6px 8px 8px}
legend{padding:0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row label{display:flex;gap:4px;align-items:center}
table.grid{border-collapse:collapse;width:100%;background:#fff;margin-bottom:10px}
.grid th{background:var(--face);text-align:left;font-weight:normal;padding:2px 6px;white-space:nowrap;position:sticky;top:0;
  border:1px solid;border-color:var(--hl) var(--dark) var(--dark) var(--hl)}
.grid td{padding:2px 6px;border-bottom:1px solid #e8e8e8;white-space:nowrap}
.grid tr:hover td{background:#eef3fb}
.grid tr.sel td{background:var(--sel);color:#fff}
.grid td.num,.grid th.num{text-align:right}
.mono{font-family:"Lucida Console",Consolas,monospace}
.tag{display:inline-block;padding:0 5px;border:1px solid #0003;font-size:11px;line-height:15px}
.st-PLANNED{background:#fff3c4}.st-DISPATCHED{background:#c8dcff}.st-COMPLETE{background:#d4efd4}
.st-REJECTED,.st-HOLD{background:#f7c9c9}.st-DRAFT{background:#eee}.st-FINAL{background:#c8dcff}.st-PAID{background:#d4efd4}
.ph-INBOUND{background:#eee}.ph-ARRIVED{background:#fff3c4}.ph-WORKING{background:#c8dcff}.ph-COMPLETE{background:#d4efd4}.ph-DEPARTED{background:#ddd;color:#666}
.c-EXPORT{color:var(--exp);font-weight:bold}.c-IMPORT{color:var(--imp);font-weight:bold}.c-EMPTY{color:var(--mty);font-weight:bold}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:10px}
.kpi{background:#fff;padding:6px 8px;border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow)}
.kpi b{display:block;font-size:20px;font-weight:normal;font-family:"Lucida Console",Consolas,monospace}
.kpi span{color:var(--muted)}
.flash{padding:5px 8px;margin-bottom:8px;border:1px solid}
.flash.ok{background:#e3f4e3;border-color:#6a6}.flash.err{background:#fbe0e0;border-color:#c66}
.yardwrap{display:grid;grid-template-columns:1fr 280px;gap:10px;align-items:start}
.blocks{display:flex;flex-wrap:wrap;gap:10px}
.block{background:#fff;padding:4px 6px 6px;border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow)}
.block h3{margin:0 0 4px;font-size:12px}
.bgrid{display:grid;gap:3px}
.stack{width:44px;height:58px;padding:2px;background:#f2f2f2;border:1px solid #bbb;cursor:pointer;display:flex;flex-direction:column-reverse;gap:1px;position:relative}
.stack:hover{border-color:#000}
.stack.cur{outline:2px solid var(--sel);outline-offset:1px}
.tier{height:11px;border:1px solid #0004}
.tier.EXPORT{background:var(--exp)}.tier.IMPORT{background:var(--imp)}.tier.EMPTY{background:var(--mty)}
.tier.held{background-image:repeating-linear-gradient(45deg,transparent 0 3px,var(--hold) 3px 5px)}
.stack .lbl{position:absolute;top:1px;left:2px;font-size:9px;color:#666}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 10px}
.legend i{display:inline-block;width:12px;height:10px;margin-right:4px;vertical-align:-1px;border:1px solid #0004}
.logpane{margin:0 4px 4px;height:92px;overflow:auto;padding:2px 6px;font-family:"Lucida Console",Consolas,monospace;font-size:11px}
.logpane div{white-space:nowrap}
.statusbar{display:flex;gap:2px;padding:2px;overflow:hidden}
.statusbar span{padding:1px 6px;border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow);white-space:nowrap}
.statusbar span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis}
.map td{white-space:normal;vertical-align:top;line-height:1.45}
.rtl{direction:rtl;text-align:right}
.note{color:var(--muted)}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)}
  nav{max-height:130px}
  .yardwrap,.stowwrap{grid-template-columns:minmax(0,1fr)}
  .app{inset:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar"><span class="t">TOS Trainer &mdash; N4-style Terminal Operating System (educational simulator)</span>
    <span class="wbtn" aria-hidden="true">_</span><span class="wbtn" aria-hidden="true">&#9633;</span><span class="wbtn" aria-hidden="true">x</span></div>
  <div class="menubar">
    <a data-act="nav" data-id="settings" tabindex="0"><u>F</u>ile</a><a data-act="nav" data-id="vessels" tabindex="0"><u>V</u>essel</a><a data-act="nav" data-id="yard" tabindex="0"><u>Y</u>ard</a><a data-act="nav" data-id="gate" tabindex="0"><u>G</u>ate</a><a data-act="nav" data-id="work" tabindex="0"><u>C</u>ontrol</a><a data-act="nav" data-id="billing" tabindex="0"><u>B</u>illing</a><a data-act="nav" data-id="mapping" tabindex="0"><u>H</u>elp</a></div>
  <div class="toolbar">
    <span class="clock" id="clock" data-tip="השעון של הנמל המדומה: יום בשבוע, תאריך ושעה. הוא זז רק כשאתה מריץ סבבים."></span>
    <span class="pstate" id="portState" data-tip="מה מותר בנמל עכשיו. WORKING = עובדים והשער פתוח. GATE CLOSED = העגורנים עובדים, אבל השער סגור למשאיות. SHABBAT = משישי 15:00 עד מוצאי שבת 20:00 שום מכונה לא מקבלת עבודה חדשה."></span>
    <button data-act="cycle">Run 1 cycle (15 min)</button>
    <button data-act="auto" id="autoBtn">Auto-run</button>
    <button data-act="day">+1 day</button>
    <span class="sep"></span>
    <button data-act="save">Save</button>
    <button data-act="reset">Reset demo</button>
  </div>
  <div class="main">
    <nav class="sunken" id="nav"></nav>
    <div class="content sunken" id="content"></div>
  </div>
  <div class="logpane sunken" id="log" aria-label="Event log"></div>
  <div class="statusbar" id="status"></div>
</div>
<div id="tip" role="tooltip" hidden></div>

<script>
'use strict';
// ---------- constants ----------
const KEY = 'tos-trainer-v1';
const T0 = Date.UTC(2026, 9, 22, 6, 0);           // simulation start, shown in UTC
const CYCLE_MIN = 15, MAX_TIER = 4;
const BLOCKS = [
  { id: 'A', use: ['EXPORT'], bays: 6, rows: 2 },
  { id: 'B', use: ['EXPORT'], bays: 6, rows: 2 },
  { id: 'C', use: ['IMPORT'], bays: 6, rows: 2 },
  { id: 'D', use: ['IMPORT', 'EMPTY'], bays: 6, rows: 2 },
];
// Ashdod South Port (HCT) scaled down x4: real 800 m / 445 m quays, 8 quay cranes, 30 ASCs (docs/research/ashdod-south-port.md)
const QUAYS = [{ id: '27', len: 200, real: 800 }, { id: '28', len: 111, real: 445 }];
const STATE_VER = 3;                              // bump when the saved shape changes, and add a MIGRATE step
// each line sails a fixed route: the 3 ports after Ashdod (UN/LOCODE). POD 1 = first stop, 3 = last stop
const ROUTES = { BLU: ['GRPIR', 'ITGOA', 'ESVLC'], RED: ['TRMER', 'GRPIR', 'NLRTM'], GRN: ['EGPSD', 'ITGOA', 'GBFXT'] };
const PORTS = { GRPIR: 'Piraeus', ITGOA: 'Genoa', ESVLC: 'Valencia', TRMER: 'Mersin', NLRTM: 'Rotterdam', EGPSD: 'Port Said', GBFXT: 'Felixstowe' };
// one ship layout for every vessel: 20' bays 01 and 03, 40' bay 06; 4 rows; tiers 02, 04 in the hold, 82, 84 on deck
const SHIP = { bays: { '01': '20', '03': '20', '06': '40' }, rows: 4, tiers: ['02', '04', '82', '84'] };
const DAYS = ['Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed'];   // T0 is Thursday 06:00 port time
const LINES = { BLU: 'Blue Ocean Lines', RED: 'Red Anchor Shipping', GRN: 'Green Wave Carriers' };
const OWNER = { BLU: 'BOLU', RED: 'RASU', GRN: 'GWCU' };
const ISO = { '22G1': "20' dry", '45G1': "40' high cube", '22R1': "20' reefer" };
const PAGES = [
  ['Terminal', [['overview', 'Overview']]],
  ['Vessel', [['vessels', 'Vessel Visits'], ['stowage', 'Stowage Plan']]],
  ['Yard', [['yard', 'Yard View'], ['inventory', 'Unit Inventory']]],
  ['Gate', [['gate', 'Gate Transactions']]],
  ['Control', [['work', 'Work Queues'], ['equipment', 'Equipment (ECS)']]],
  ['Billing', [['billing', 'Charges & Invoices']]],
  ['Help', [['mapping', 'How it maps to N4'], ['settings', 'Settings']]],
];
// Hebrew tooltips for every clickable thing, keyed by data-act (nav links by page id)
const PAGE_TIPS = {
  overview: 'מסך הסיכום: כמה מכולות יש, כמה עבודה פתוחה, וכמה כסף נכנס.',
  vessels: 'רשימת האוניות: יצירת אונייה חדשה, הגעה לרציף, התחלת עבודה ויציאה.',
  stowage: 'תוכנית ההעמסה: איזו מכולה עולה לאיזה מקום באונייה, ולמה.',
  yard: 'מפת החצר: איפה כל מכולה עומדת. לחיצה על ערימה מראה מה בתוכה.',
  inventory: 'רשימת כל המכולות עם הפרטים שלהן. כאן משחררים עיכוב מכס.',
  gate: 'השער: משאיות שמביאות מכולות, או באות לקחת מכולות.',
  work: 'תורי העבודה: כל הזזה של מכולה היא משימה שמחכה לציוד פנוי.',
  equipment: 'הציוד: עגורנים ורכבים. רואים מי עסוק ובמה.',
  billing: 'כסף: תעריפים, חיובים, חשבוניות ותשלומים.',
  mapping: 'הסבר: איך כל מסך כאן דומה למערכת N4 האמיתית.',
  settings: 'הגדרות: להדליק או לכבות את בועות ההסבר ואת תיבות ההסבר הצהובות.',
};
// per-screen tooltip on the screen title: what you see here, and what you can do here
const SCREEN_TIPS = {
  overview: 'מה רואים: מפה של הנמל (ים, שני רציפים, עגורנים, 4 בלוקים ומסילת רכבת) וסיכום של כל הנמל: כמה מכולות בחצר, כמה אוניות ברציף, כמה עבודה פתוחה וכמה כסף. מה אפשר לעשות: רק להסתכל. הפעולות עצמן נעשות במסכים האחרים.',
  vessels: 'מה רואים: כל האוניות, ליד איזה רציף כל אחת, באיזה שלב היא (בדרך, ברציף, בעבודה, סיימה, יצאה), וכמה מקומות בתוכנית ההעמסה כבר מלאים. מה אפשר לעשות: ליצור אונייה חדשה ולבחור לה רציף, להביא אותה לרציף, להתחיל עבודה, לפתוח את תוכנית ההעמסה ולשלוח אותה לדרך.',
  stowage: 'מה רואים: חתך של האונייה, bay אחד בכל פעם: שורות לרוחב, קומות לגובה, קו עבה בין הבטן (למטה) לסיפון (למעלה). מקום עם קו מקווקו = מתוכנן, מלא = כבר על האונייה, אדום עם ! = אזהרה. מה אפשר לעשות: לבחור אונייה ו-bay, להחליף צבע לפי נמל יעד או לפי משקל, וללחוץ על מקום כדי לקרוא למה המכולה שם.',
  yard: 'מה רואים: מפת החצר, בלוק אחרי בלוק, וכל ערימה של מכולות לפי צבע הסוג. מה אפשר לעשות: ללחוץ על ערימה ולראות אילו מכולות בתוכה, מלמעלה למטה.',
  inventory: 'מה רואים: רשימה של כל המכולות, עם הסוג, המיקום, המשקל, ימי האחסנה והעיכובים. מה אפשר לעשות: לשחרר עיכוב מכס, ולהציג גם מכולות שכבר יצאו.',
  gate: 'מה רואים: כל המשאיות שהגיעו לשער, ומה קרה לכל אחת (התקבלה, או נדחתה ולמה, למשל עיכוב מכס או שער סגור). מה אפשר לעשות: להכניס משאית עם מכולה, או לשלוח משאית לקחת מכולה מהחצר. השער פתוח א\'-ה\' 05:00-24:00, שישי 05:00-14:45, שבת סגור.',
  work: 'מה רואים: תורי העבודה. כל הזזה של מכולה היא משימה שמחכה, נשלחת לציוד או הסתיימה. מה אפשר לעשות: להציג גם משימות שהסתיימו. המשימות עצמן זזות כשמריצים סבבים.',
  equipment: 'מה רואים: כל המכונות בנמל (2 עגורני רציף, 4 רכבים אוטונומיים ו-8 עגורני חצר, שניים בכל בלוק), מי עסוק, באיזו משימה, וכמה הזזות עשה. בשבת מכונה פנויה מסומנת SHABBAT. מה אפשר לעשות: רק להסתכל.',
  billing: 'מה רואים: המחירים, החיובים שעוד לא נכנסו לחשבונית, והחשבוניות. מה אפשר לעשות: לשנות מחירים, להפיק חשבוניות, לנעול, לרשום תשלום ולתת זיכוי.',
  mapping: 'מה רואים: טבלה שמסבירה איזה רעיון של N4 כל מסך כאן מדגים, ומה חסר לעומת המערכת האמיתית. מה אפשר לעשות: רק לקרוא.',
  settings: 'מה רואים: הגדרות העזרה. מה אפשר לעשות: להדליק או לכבות את התיבות הצהובות ואת הבועות. ההגדרה נשמרת בדפדפן.',
};

// ---------- vessel stowage (Autostow-style) ----------
const sizeOf = u => u.iso[0] === '4' ? '40' : '20';

// rule for one stack: a box above must leave at the same port or earlier, and inside one port be no heavier
function ruleBreak(v, k) {

// built once when work starts: later stop lower, then heavier lower, then higher in the yard first
function buildPlan(v) {

// ISO 6346 check digit (letters skip multiples of 11)

    s.wis.forEach(w => { w.eq = (w.eq || []).map(id => ren[id] || id); });

// Lift a unit out of its stack. Anything on top gets moved first (a rehandle).
function retrieve(u, wi) {
  const st = S.stacks[u.pos];
  let n = 0;
  while (st[st.length - 1] !== u.id) {
    const topId = st.pop(), top = S.units[topId];
    const sameBlock = Object.keys(S.stacks).filter(k => k[0] === u.pos[0] && k !== u.pos && heightOf(k) < MAX_TIER);
    const to = sameBlock.sort((a, b) => heightOf(a) - heightOf(b))[0] || planSlot(top, u.pos);
    placeUnit(top, to);
    n++;
    log('YARD', `Rehandle: ${topId} moved ${u.pos} -> ${to} to dig out ${u.id}`);
  }
  st.pop();
  u.pos = null;
  if (wi) wi.rehandles = n;
  S.stats.rehandles += n;
}

// ---------- billing ----------
function charge(u, type, amount, note) {
  if (!amount) return;
  S.charges.push({ id: 'C' + String(++S.seq.chg).padStart(4, '0'), line: u.line, unit: u.id, type, amount, note: note || '', time: S.clock, invoice: null });
}
function chargeStorage(u) {
  const due = storageDue(u);
  if (due) charge(u, 'STORAGE', due, `${daysIn(u)} days (Saturday not counted), ${S.tariff.freeDays} free`);
}

// ---------- work instructions & equipment control ----------
function newWI(kind, u, extra) {
  const wi = Object.assign({ id: 'WI' + String(++S.seq.wi).padStart(4, '0'), kind, unit: u.id, status: 'PLANNED', eq: [], dest: null, from: null,
    created: S.clock, done: null, rehandles: 0, note: '' }, extra);
  u.wi = wi.id;
  S.wis.push(wi);
  return wi;
}
function needs(wi, destKey) {
  const u = S.units[wi.unit];
  switch (wi.kind) {
    case 'DISCHARGE': return ['QC', 'AGV', 'ASC-' + blockOf(destKey)];
    case 'LOAD': return ['ASC-' + blockOf(u.pos), 'AGV', 'QC'];
    case 'GATE_IN': return ['ASC-' + blockOf(destKey)];
    case 'GATE_OUT': return ['ASC-' + blockOf(u.pos)];
  }
  return [];
}
function tryDispatch(wi) {
  const u = S.units[wi.unit];
  let dest = null;
  if (wi.kind === 'DISCHARGE' || wi.kind === 'GATE_IN') {
    dest = planSlot(u);
    if (!dest) { wi.note = 'No yard space'; return false; }
  }
  const picked = [];
  for (const type of needs(wi, dest)) {
    const e = S.eq.find(x => x.type === type && x.status === 'IDLE' && !picked.includes(x));
    if (!e) { wi.note = 'Waiting for ' + type; return false; }
    picked.push(e);
  }
  picked.forEach(e => { e.status = 'BUSY'; e.wi = wi.id; });
  wi.eq = picked.map(e => e.id);
  wi.dest = dest;
  wi.from = wi.kind === 'DISCHARGE' ? 'Vessel' : wi.kind === 'GATE_IN' ? 'Gate lane' : u.pos;
  wi.status = 'DISPATCHED';
  wi.note = '';
  wi.started = S.clock;
  log('ECS', `${wi.id} ${wi.kind} ${u.id} sent to ${wi.eq.join(' + ')}`);
  return true;
}
function complete(wi) {
  const u = S.units[wi.unit];
  const t = S.tariff;
  const v = visitById(u.visit);
  if (wi.kind === 'DISCHARGE') {
    if (v && u.vslot && v.onboard[u.vslot] === u.id) delete v.onboard[u.vslot];
    u.vslot = null;
    placeUnit(u, wi.dest); u.state = 'YARD'; u.inTime = S.clock;
    charge(u, 'LIFT_DISCH', t.lift, 'Vessel discharge');
  } else if (wi.kind === 'GATE_IN') {
    placeUnit(u, wi.dest); u.state = 'YARD'; u.inTime = S.clock;
    charge(u, 'GATE_IN', t.gateFee + t.lift, 'Gate + lift off truck');
    const tx = S.gate.find(g => g.wi === wi.id); if (tx) tx.status = 'COMPLETE';
  } else if (wi.kind === 'LOAD') {
    wi.from = posLabel(u);
    retrieve(u, wi); u.state = 'LOADED'; u.outTime = S.clock;
    if (v && u.vslot) v.onboard[u.vslot] = u.id;
    charge(u, 'LIFT_LOAD', t.lift, 'Vessel load'); chargeStorage(u);
  } else if (wi.kind === 'GATE_OUT') {
    wi.from = posLabel(u);
    retrieve(u, wi); u.state = 'DEPARTED'; u.outTime = S.clock;
    charge(u, 'GATE_OUT', t.gateFee + t.lift, 'Gate + lift on truck'); chargeStorage(u);
    const tx = S.gate.find(g => g.wi === wi.id); if (tx) tx.status = 'COMPLETE';
  }
  wi.eq.forEach(id => { const e = S.eq.find(x => x.id === id); e.status = 'IDLE'; e.wi = null; e.moves++; });
  wi.status = 'COMPLETE'; wi.done = S.clock; wi.note = '';
  u.wi = null;
  S.stats.moves++;
  log('ECS', `${wi.id} ${wi.kind} ${u.id} done -> ${wi.kind === 'DISCHARGE' || wi.kind === 'GATE_IN' ? wi.dest : u.state}` + (wi.rehandles ? ` (${wi.rehandles} rehandle${wi.rehandles > 1 ? 's' : ''})` : ''));
  // an export that arrives while its vessel is working joins the load queue
  if (wi.kind === 'GATE_IN' && u.category === 'EXPORT' && v && v.phase === 'WORKING') {
    if (!v.plan) newWI('LOAD', u, { visit: v.id });
    else if (lateSlot(v, u)) {
      newWI('LOAD', u, { visit: v.id, seq: v.plan[u.vslot].seq });
      log('VESSEL', `Late export ${u.id} planned to ${v.vessel} slot ${u.vslot}` + (ruleBreak(v, u.vslot) ? ' (warning: breaks a stowage rule)' : ''));
    } else { u.short = true; log('VESSEL', `${u.id} short-shipped: no ${sizeOf(u)}' slot left on ${v.vessel}`); }
  }
}
function cycle() {
  S.clock += CYCLE_MIN;
  S.wis.filter(w => w.status === 'DISPATCHED').forEach(complete);
  // vessel arrivals by ETA (a vessel whose quay is taken waits)
  S.visits.filter(v => v.phase === 'INBOUND' && v.eta <= S.clock).forEach(v => arrive(v));
  // Shabbat: running jobs finish above, but no new job is sent to any machine
  const work = isWorkTime(S.clock);
  if (work !== S.workOn) {
    S.workOn = work;
    log('SYSTEM', work ? 'Motzei Shabbat: work resumes' : 'Shabbat: no new work until Sat 20:00');
  }
  const planned = S.wis.filter(w => w.status === 'PLANNED');
  if (!work) { planned.forEach(w => { w.note = 'Shabbat'; }); return finishVisits(); }
  // discharge before load on the same vessel; discharge top tier first, load in plan order, the rest by creation
  const order = { DISCHARGE: 0, GATE_IN: 1, GATE_OUT: 1, LOAD: 2 };
  const rank = w => {
    const u = S.units[w.unit];
    if (w.kind === 'LOAD' && w.seq != null) return w.seq;
    if (w.kind === 'DISCHARGE' && u.vslot) return -SHIP.tiers.indexOf(slotParts(u.vslot).tier);
    return w.created;
  };
  planned
    .sort((a, b) => order[a.kind] - order[b.kind] || rank(a) - rank(b))
    .forEach(w => {
      const u = S.units[w.unit], v = visitById(w.visit);
      if (w.kind === 'LOAD' && S.wis.some(d => d.kind === 'DISCHARGE' && d.visit === w.visit && d.status !== 'COMPLETE')) { w.note = 'After discharge'; return; }
      // a box cannot float: the slot below must hold its box first; a box cannot be lifted out from under another
      if (w.kind === 'LOAD' && v && v.plan && u.vslot && slotBelow(u.vslot) && !v.onboard[slotBelow(u.vslot)]) { w.note = 'Slot below not loaded'; return; }
      if (w.kind === 'DISCHARGE' && v && u.vslot && slotAbove(u.vslot) && v.onboard[slotAbove(u.vslot)]) { w.note = 'Slot above not discharged'; return; }
      tryDispatch(w);
    });
  finishVisits();
}
function finishVisits() {
  S.visits.filter(v => v.phase === 'WORKING').forEach(v => {
    if (!S.wis.some(w => w.visit === v.id && w.status !== 'COMPLETE')) { v.phase = 'COMPLETE'; log('VESSEL', `${v.vessel} (${v.id}) work complete`); }
  });
}

// ---------- vessel ----------
// a quay holds one vessel from arrival until it departs
const quayHolder = (quay, except) => S.visits.find(x => x !== except && x.quay === quay && ['ARRIVED', 'WORKING', 'COMPLETE'].includes(x.phase));
function arrive(v) {
  const other = quayHolder(v.quay, v);
  if (other) {
    if (!v.wait) log('VESSEL', `${v.vessel} (${v.id}) waiting: quay ${v.quay} is taken by ${other.vessel}`);
    v.wait = `Waiting for quay ${v.quay} (${other.vessel})`;
    return false;
  }
  v.wait = null; v.phase = 'ARRIVED'; v.ata = S.clock;
  log('VESSEL', `${v.vessel} (${v.id}) arrived at quay ${v.quay}`);
  return true;
}
function startWork(v) {
  let d = 0, l = 0;
  const short = buildPlan(v);
  Object.values(S.units).forEach(u => {
    if (u.visit !== v.id || u.wi) return;
    if (u.category === 'IMPORT' && u.state === 'ON_VESSEL') { newWI('DISCHARGE', u, { visit: v.id }); d++; }
    if (u.category === 'EXPORT' && u.state === 'YARD' && v.plan[u.vslot]?.unit === u.id) { newWI('LOAD', u, { visit: v.id, seq: v.plan[u.vslot].seq }); l++; }
  });
  v.phase = 'WORKING';
  log('VESSEL', `${v.vessel}: work started, stowage plan built (${l} slots), ${d} discharge + ${l} load instructions created` + (short ? `, ${short} short-shipped` : ''));
  flash('ok', `${d} discharge and ${l} load work instructions created, following the stowage plan.` + (short ? ` ${short} export(s) did not fit and stay in the yard.` : '') + ' Run cycles to execute them.');
}
function depart(v) {
  v.phase = 'DEPARTED'; v.atd = S.clock;
  let rolled = 0;
  Object.values(S.units).forEach(u => {
    if (u.visit !== v.id) return;
    if (u.state === 'LOADED') u.state = 'DEPARTED';
    else if (u.category === 'EXPORT' && u.state !== 'DEPARTED') {
      rolled++;
      if (v.plan && u.vslot && v.plan[u.vslot]?.unit === u.id) delete v.plan[u.vslot];
      u.vslot = null;
    }
  });
  log('VESSEL', `${v.vessel} departed` + (rolled ? `, ${rolled} export(s) rolled (left behind)` : ''));
}

}

        `<p class="rtl">${esc(slotReason(v, UI.slot))}</p>` + (ruleBreak(v, UI.slot) ? `<p class="flash err">${esc(ruleBreak(v, UI.slot))}</p>` : '');
    }
    const route = ROUTES[v.line].map((c, i) => `${i + 1}. ${c} ${PORTS[c]}`).join(' &rarr; ');
    return head + `<p>${visits}</p>
      <p><b>${esc(v.vessel)}</b> (${v.id}, ${v.line}, quay ${v.quay}, ${v.phase}). Route after Ashdod: ${route}</p>
      <p class="pstatus">${v.plan ? `Planned ${planned} / Loaded ${loaded} / Warnings ${warns}` + (short ? ` / Short-shipped ${short}` : '') +
        ` &nbsp; Yard rehandles caused by this load: ${yardReh}` + (planned && loaded === planned ? ' ' + tag('st-COMPLETE', 'COMPLETE') : '')
        : v.phase === 'INBOUND' || v.phase === 'ARRIVED' ? 'No stowage plan yet. It is built when work starts.' : 'No plan (this vessel started work before version 3).'}</p>
      <p>${bayBtns} &nbsp; ${modes}</p>
      <div class="stowwrap"><div class="baywrap"><div class="baygrid" style="grid-template-columns:34px repeat(${SHIP.rows},62px)">${grid}</div>
      <div class="legend"><span><i class="lg-planned"></i>Planned (dashed)</span><span><i class="lg-on"></i>On board (solid)</span><span><i class="lg-warn"></i>! Warning</span>${mode === 'pod' ? '<span><i class="pod1"></i>Stop 1</span><span><i class="pod2"></i>Stop 2</span><span><i class="pod3"></i>Stop 3</span>' : '<span>Darker = heavier</span>'}</div></div>
      <div>${side}</div></div>`;
  },
  yard() {
    const sel = UI.stack;
    const blocks = BLOCKS.map(b => {
      let cells = '';
      for (let row = 1; row <= b.rows; row++) for (let bay = 1; bay <= b.bays; bay++) {
        const key = stackKey(b.id, bay, row);
        const tiers = S.stacks[key].map(id => { const u = S.units[id]; return `<div class="tier ${u.category} ${u.holds.length ? 'held' : ''}" title="${id}"></div>`; }).join('');
        cells += `<div class="stack ${sel === key ? 'cur' : ''}" data-act="stack" data-id="${key}" title="${key}: ${S.stacks[key].length}/${MAX_TIER}"><span class="lbl">${String(bay).padStart(2, '0')}-${row}</span>${tiers}</div>`;
      }
      return `<div class="block"><h3>Block ${b.id} <span class="note">(${b.use.join(' + ')})</span></h3>
        <div class="bgrid" style="grid-template-columns:repeat(${b.bays},44px)">${cells}</div></div>`;
    }).join('');
    let side = '<p class="note">Click a stack to see what is inside.</p>';
    if (sel) {
      const st = S.stacks[sel];
      side = `<b>Stack ${sel}</b> (${st.length}/${MAX_TIER} tiers)<table class="grid"><tr><th>Tier</th><th>Unit</th><th>Cat.</th><th>Vessel</th></tr>` +
        st.map((id, i) => { const u = S.units[id]; return { i, u }; }).reverse().map(({ i, u }) =>
          `<tr><td>T${i + 1}</td><td>${unitLink(u.id)}${u.holds.length ? ' ' + tag('st-HOLD', 'HOLD') : ''}</td><td class="c-${u.category}">${u.category}</td><td>${u.visit ? esc(visitById(u.visit)?.vessel || u.visit) : '-'}</td></tr>`).join('') +
        '</table><p class="note">Top of the stack is first. To take out a lower box, the crane must first move everything above it (a rehandle).</p>';
    }
    return header('Yard View', 'Yard blocks, stacks and tiers; Expert Decking (rule-based slot choice)',
      'החצר מחולקת לבלוקים, וכל בלוק לערימות. כל ריבוע קטן הוא מכולה, והערימה בגובה עד 4. ירוק = ייצוא, כתום = יבוא, אפור = ריקה, פסים אדומים = עיכוב מכס. המערכת בוחרת מקום לבד לפי חוק פשוט: מכולות של אותה אונייה נערמות יחד, כדי שבהעמסה לא יצטרכו לחפור.') +
      `<div class="legend"><span><i style="background:var(--exp)"></i>Export</span><span><i style="background:var(--imp)"></i>Import</span><span><i style="background:var(--mty)"></i>Empty</span><span><i class="tier held" style="background-color:var(--imp)"></i>On hold</span></div>
      <div class="yardwrap"><div class="blocks">${blocks}</div><div>${side}</div></div>`;
  },
  inventory() {
    const units = Object.values(S.units).filter(u => u.state !== 'DEPARTED' || UI.showGone);
    return header('Unit Inventory', 'Units (containers) with category, freight kind, position, holds',
      'כל מכולה במערכת. המספר שלה בנוי כמו מספר אמיתי: 4 אותיות של הבעלים, 6 ספרות, וספרת ביקורת בסוף (מחושבת בנוסחה של תקן ISO 6346). כאן גם משחררים עיכוב מכס, ורואים כמה ימים המכולה כבר בחצר וכמה אחסנה היא צוברת.') +
      `<p><label><input type="checkbox" data-act="showGone" ${UI.showGone ? 'checked' : ''}> Show departed units</label></p>
      <table class="grid"><tr><th>Unit</th><th>Type</th><th>Cat.</th><th>Line</th><th>Vessel visit</th><th>State</th><th>Position</th><th class="num">Tons</th><th class="num">Days</th><th class="num">Storage so far</th><th>Holds</th><th>Open WI</th></tr>` +
      units.map(u => `<tr class="${UI.unit === u.id ? 'sel' : ''}"><td>${unitLink(u.id)}</td><td>${u.iso} <span class="note">${ISO[u.iso]}</span></td><td class="c-${u.category}">${u.category}</td>
        <td>${u.line}</td><td>${u.visit ? esc(visitById(u.visit)?.vessel || '') + ' ' + u.visit : '-'}</td><td>${u.state}</td><td class="mono">${posLabel(u)}</td>
        <td class="num">${u.weight}</td><td class="num">${u.inTime != null ? daysIn(u) : '-'}</td><td class="num">${u.inTime != null ? money(storageDue(u)) : '-'}</td>
        <td>${u.holds.map(h => tag('st-HOLD', h) + ` <button class="sm" data-act="release" data-id="${u.id}">Release</button>`).join('')}</td><td>${u.wi || ''}</td></tr>`).join('') + '</table>';
  },
  gate() {
    const open = S.visits.filter(v => !['DEPARTED'].includes(v.phase));
    const pickups = Object.values(S.units).filter(u => u.state === 'YARD' && !u.wi && u.category !== 'EXPORT');
    return header('Gate Transactions', 'Gate: truck visits, receive export / deliver import, hold checks',
      'בשער נכנסות משאיות. משאית שמביאה מכולת ייצוא (Receive) צריכה לציין לאיזו אונייה היא מיועדת. משאית שבאה לקחת מכולת יבוא (Deliver) תידחה אם יש על המכולה עיכוב מכס. אחרי שהשער מאשר, נוצרת משימה לעגורן החצר. שעות השער כמו בנמל הדרום: ראשון עד חמישי 05:00-24:00, שישי 05:00-14:45, שבת סגור. משאית שמגיעה מחוץ לשעות נדחית, ורואים בטבלה מתי השער ייפתח.') +
      `<fieldset><legend>Receive (gate in)</legend><form class="row" data-form="gatein">
        <label data-tip="ייצוא = מכולה מלאה שתעלה על אונייה. ריקה = מכולה ריקה שחוזרת לנמל.">Type <select name="kind"><option value="EXPORT">Export full, booked to vessel</option><option value="EMPTY">Empty return</option></select></label>
        <label data-tip="לאיזו אונייה מכולת הייצוא מיועדת.">Vessel visit <select name="visit">${open.map(v => `<option value="${v.id}">${v.id} ${esc(v.vessel)} (${v.phase})</option>`).join('')}</select></label>
        <label data-tip="לאיזה נמל מכולת הייצוא נוסעת: תחנה 1, 2 או 3 במסלול של האונייה. תחנה 3 היא האחרונה, ולכן מכולה כזו תעמוד למטה באונייה. למכולה ריקה זה לא משנה.">POD <select name="pod">${[1, 2, 3].map(p => `<option value="${p}">Stop ${p}${open[0] ? ' (' + open.map(v => v.id + ' ' + podCode(v, p)).join(', ') + ')' : ''}</option>`).join('')}</select></label>
        <label data-tip="חברת הספנות שהמכולה שייכת לה.">Line <select name="line">${Object.keys(LINES).map(l => `<option>${l}</option>`).join('')}</select></label>
        <label data-tip="סוג המכולה לפי תקן בינלאומי: 20 רגל רגילה, 40 רגל גבוהה, או 20 רגל מקוררת.">ISO <select name="iso">${Object.keys(ISO).map(i => `<option value="${i}">${i} ${ISO[i]}</option>`)}</select></label>
        <button data-tip="המשאית נכנסת עם המכולה, ונוצרת משימה לעגורן החצר להוריד אותה.">Gate in</button></form></fieldset>
      <fieldset><legend>Deliver (gate out)</legend><form class="row" data-form="gateout">
        <label data-tip="איזו מכולה המשאית באה לקחת. מכולה עם [HOLD] תידחה בשער.">Unit to pick up <select name="unit">${pickups.map(u => `<option value="${u.id}">${u.id} ${u.category} ${u.holds.length ? '[HOLD]' : ''} @ ${posLabel(u)}</option>`).join('')}</select></label>
        <button data-tip="השער בודק את המכולה. אם אין עיכוב, נוצרת משימה להוציא אותה מהחצר למשאית." ${pickups.length ? '' : 'disabled'}>Gate out</button></form></fieldset>
      <table class="grid"><tr><th>Tx</th><th>Time</th><th>Truck</th><th>Type</th><th>Unit</th><th>Status</th><th>Reason / WI</th></tr>` +
      S.gate.slice().reverse().map(g => `<tr><td>${g.id}</td><td>${fmt(g.time)}</td><td class="mono">${g.truck}</td><td>${g.kind}</td><td>${g.unit ? unitLink(g.unit) : '-'}</td><td>${tag('st-' + g.status, g.status)}</td><td>${esc(g.reason || g.wi || '')}</td></tr>`).join('') + '</table>';
  },
  work() {
    const groups = ['DISCHARGE', 'LOAD', 'GATE_IN', 'GATE_OUT'];
    const showDone = UI.showDone;
    return header('Work Queues', 'Work instructions in work queues, dispatched to the Equipment Control System (ECS)',
      'כל תנועה של מכולה היא "הוראת עבודה". ההוראה מחכה בתור (PLANNED), המערכת שולחת אותה לציוד פנוי (DISPATCHED), והציוד מבצע (COMPLETE). פריקה צריכה עגורן רציף + רכב אוטונומי + עגורן חצר. אם חסר ציוד פנוי, ההוראה מחכה, ורואים למה בעמודה Note.') +
      `<p><label><input type="checkbox" data-act="showDone" ${showDone ? 'checked' : ''}> Show completed</label></p>` +
      groups.map(g => {
        const list = S.wis.filter(w => w.kind === g && (showDone || w.status !== 'COMPLETE'));
        const counts = ['PLANNED', 'DISPATCHED', 'COMPLETE'].map(s => `${s.toLowerCase()} ${S.wis.filter(w => w.kind === g && w.status === s).length}`).join(', ');
        return `<fieldset><legend>Queue ${g} &ndash; ${counts}</legend>` + (list.length ? `<table class="grid"><tr><th>WI</th><th>Unit</th><th>From</th><th>To</th><th>Equipment</th><th>Status</th><th>Created</th><th>Done</th><th class="num">Rehandles</th><th>Note</th></tr>` +
          list.map(w => `<tr><td>${w.id}</td><td>${unitLink(w.unit)}</td><td class="mono">${esc(w.from || (w.kind === 'LOAD' || w.kind === 'GATE_OUT' ? posLabel(S.units[w.unit]) : ''))}</td>
            <td class="mono">${w.dest || (w.kind === 'LOAD' ? 'Vessel' : w.kind === 'GATE_OUT' ? 'Truck' : '')}</td><td>${w.eq.join(' + ')}</td><td>${tag('st-' + w.status, w.status)}</td>
            <td>${fmt(w.created)}</td><td>${w.done != null ? fmt(w.done) : ''}</td><td class="num">${w.rehandles || ''}</td><td>${esc(w.note)}</td></tr>`).join('') + '</table>' : '<p class="note">Empty.</p>') + '</fieldset>';
      }).join('');
  },
  equipment() {
    return header('Equipment (ECS)', 'Equipment Control System; QC, AGV/AHT Manager, ASC Manager',
      'בנמל אוטומטי, ה-TOS מחליט "מה" לעשות, ומערכת בקרת הציוד (ECS) מחליטה "איך" להזיז את המכונות. כאן, כמו בנמל הדרום מוקטן פי 4: 2 עגורני רציף (QC), 4 רכבים אוטונומיים (AGV), ו-2 עגורני חצר אוטומטיים (ASC) בכל בלוק, 8 בסך הכל. משימה בבלוק לוקחת את העגורן הפנוי מבין השניים. בשבת מכונה פנויה מסומנת SHABBAT ולא מקבלת עבודה.') +
      `<table class="grid"><tr><th>Equipment</th><th>Kind</th><th>Status</th><th>Current WI</th><th class="num">Moves done</th></tr>` +
      S.eq.map(e => `<tr><td class="mono"><span class="eqname">${e.id}</span></td><td>${e.desc}</td><td>${eqStatus(e)}</td><td>${e.wi || ''}</td><td class="num">${e.moves}</td></tr>`).join('') + '</table>';
  },
  billing() {
    const t = S.tariff;
    const unbilled = S.charges.filter(c => !c.invoice);
    return header('Charges & Invoices', 'Billing: tariffs, billable events, invoices, payments, credits',
      'הנמל מרוויח מכל תנועה. כל הרמה של מכולה יוצרת חיוב. מכולה שנשארת בחצר יותר מימי החינם משלמת אחסנה ליום, והחיוב נרשם כשהיא יוצאת. כל יום בלוח שבו המכולה הייתה בחצר נספר, חוץ משבת, כי שבת היא יום חופש בנמל. "Generate invoices" מאגד את כל החיובים הפתוחים לחשבונית אחת לכל חברת ספנות. אפשר לתת זיכוי (Credit) על חיוב שגוי.') +
      `<fieldset><legend>Tariffs</legend><form class="row" data-form="tariff">
        <label data-tip="כמה עולה כל הרמה של מכולה בעגורן.">Lift $ <input name="lift" type="number" min="0" value="${t.lift}" style="width:70px"></label>
        <label data-tip="כמה עולה כל מעבר של משאית בשער.">Gate fee $ <input name="gateFee" type="number" min="0" value="${t.gateFee}" style="width:70px"></label>
        <label data-tip="כמה עולה כל יום אחסנה, אחרי שנגמרו ימי החינם.">Storage $/day <input name="storagePerDay" type="number" min="0" value="${t.storagePerDay}" style="width:70px"></label>
        <label data-tip="כמה ימים מכולה יכולה לשבת בחצר בלי לשלם אחסנה.">Free days <input name="freeDays" type="number" min="0" value="${t.freeDays}" style="width:60px"></label>
        <button data-tip="שומר את המחירים. הם חלים רק על חיובים חדשים.">Save tariffs</button><span class="note">Applies to new charges only.</span></form></fieldset>
      <fieldset><legend>Billable events not yet invoiced (${unbilled.length}, ${money(unbilled.reduce((s, c) => s + c.amount, 0))})</legend>
        <p><button data-act="invoice" ${unbilled.length ? '' : 'disabled'}>Generate invoices</button></p>${chargeTable(unbilled)}</fieldset>
      <fieldset><legend>Invoices</legend><table class="grid"><tr><th>Invoice</th><th>Line</th><th>Created</th><th class="num">Items</th><th class="num">Total</th><th>Status</th><th>Actions</th></tr>` +

        ${i.status === 'FINAL' ? `<button class="sm" data-act="pay" data-id="${i.id}">Record payment</button>` : ''}
        <button class="sm" data-act="invView" data-id="${i.id}">${UI.inv === i.id ? 'Hide' : 'Lines'}</button></td></tr>` +
        (UI.inv === i.id ? `<tr><td colspan="7">${chargeTable(S.charges.filter(c => c.invoice === i.id), true)}</td></tr>` : '')).join('') + '</table></fieldset>';
  },
  settings() {
    return header('Settings', 'User preferences',
      'כאן אתה קובע כמה עזרה המערכת מציגה. בהתחלה כדאי להשאיר הכל דלוק. כשתכיר את המסכים, אפשר לכבות. ההגדרות נשמרות בדפדפן, ולחיצה על Reset demo לא מוחקת אותן.') +
      `<fieldset><legend>Help</legend>
        <p><label><input type="checkbox" data-act="prefHelp" ${PREFS.help ? 'checked' : ''}> Show the yellow explanation box at the top of every screen</label></p>
        <p><label><input type="checkbox" data-act="prefTips" ${PREFS.tips ? 'checked' : ''}> Show tooltips on buttons and fields (hover with the mouse or move to them with Tab)</label></p>

  },
  mapping() {

      ['Rehandles', 'אם המכולה לא למעלה, מזיזים את מה שמעליה וסופרים.', 'זו המטרה העיקרית של תכנון חצר טוב: פחות הזזות מיותרות.', '-'],
      ['Gate', 'קבלת מכולת ייצוא, החזרת ריקה, מסירת יבוא. דחייה אם יש עיכוב.', 'N4 מנהל פעולות שער וביקורי משאיות (Gate).', 'אין תיאום תורים מראש (Appointments), אין מצלמות/OCR.'],

const eqStatus = e => e.status === 'BUSY' ? tag('st-DISPATCHED', 'BUSY')

// overview map: sea, the two quays drawn to scale, the AGV lane, the 4 blocks with their ASCs, the rail siding
function layoutPanel() {
  const PX = 1.6;   // pixels per scaled metre
  const quays = QUAYS.map(q => {
    const v = quayHolder(q.id);
    const waiting = S.visits.filter(x => x.quay === q.id && x.wait).length;
    return `<div class="quay" style="width:${Math.round(q.len * PX)}px"><b>Quay ${q.id}</b> <span class="note">${q.real} m real, ${q.len} m here</span>
      <div>${v ? esc(v.vessel) + ' ' + tag('ph-' + v.phase, v.phase) : '<span class="note">free</span>'}${waiting ? ` <span class="note">(${waiting} waiting)</span>` : ''}</div></div>`;
  }).join('');
  const qcs = S.eq.filter(e => e.type === 'QC').map(e => `<span class="eqname">${e.id}</span> ${eqStatus(e)}`).join(' ');
  const agvs = S.eq.filter(e => e.type === 'AGV').map(e => `<span class="eqname">${e.id}</span> ${eqStatus(e)}`).join(' ');
  const blocks = BLOCKS.map(b => {
    const used = Object.keys(S.stacks).filter(k => k[0] === b.id).reduce((n, k) => n + S.stacks[k].length, 0);
    return `<div class="lblock"><b>Block ${b.id}</b> <span class="note">${b.use.join(' + ')}, ${used}/${b.bays * b.rows * MAX_TIER}</span>` +
      S.eq.filter(e => e.type === 'ASC-' + b.id).map(e => `<div class="mono"><span class="eqname">${e.id}</span> ${eqStatus(e)}</div>`).join('') + '</div>';
  }).join('');
  return `<fieldset><legend>Terminal layout &ndash; Ashdod South Port, scaled down x4</legend><div class="layout">
    <div class="sea">Sea</div><div class="quays">${quays}</div>
    <div class="lane"><span class="mono">Quay cranes: ${qcs}</span><span class="mono">AGV lane: ${agvs}</span></div>
    <div class="lblocks">${blocks}</div>
    <div class="rail">Rail siding &ndash; trains come in version 7</div></div>
    <p class="note">Real port: 8 quay cranes and 30 automated stacking cranes. Here: 2 and 8.</p></fieldset>`;
}
function visitTable(list, actions) {
  return `<table class="grid"><tr><th>Visit</th><th>Vessel</th><th>Line</th><th>Quay</th><th>Phase</th><th>ETA</th><th>ATA</th><th>ATD</th><th class="num">To discharge</th><th class="num">To load</th><th>Plan</th>${actions ? '<th>Actions</th>' : ''}</tr>` +
    list.map(v => {
      const us = Object.values(S.units).filter(u => u.visit === v.id);
      const disch = us.filter(u => u.category === 'IMPORT' && u.state === 'ON_VESSEL').length;
      const load = us.filter(u => u.category === 'EXPORT' && ['YARD', 'AT_GATE'].includes(u.state)).length;
      let act = '';
      if (actions) {
        if (v.phase === 'INBOUND') act = `<button class="sm" data-act="arrive" data-id="${v.id}">Arrive now</button>`;
        if (v.phase === 'ARRIVED') act = `<button class="sm" data-act="start" data-id="${v.id}">Start work</button>`;
        if (v.phase === 'COMPLETE' || v.phase === 'WORKING') act = `<button class="sm" data-act="depart" data-id="${v.id}" ${v.phase === 'WORKING' ? 'disabled title="Finish work first"' : ''}>Depart</button>`;
        if (v.phase !== 'DEPARTED') act += ` <button class="sm" data-act="stowOpen" data-id="${v.id}">Stowage plan</button>`;
      }
      let planTxt = 'not planned';
      if (v.plan) {
        const ks = Object.keys(v.plan), w = ks.filter(k => ruleBreak(v, k)).length;
        planTxt = `${ks.length} planned, ${ks.filter(k => v.onboard[k] === v.plan[k].unit).length} loaded` + (w ? `, ${w} warning${w > 1 ? 's' : ''}` : '');
      }
      return `<tr><td>${v.id}</td><td>${esc(v.vessel)}</td><td>${v.line}</td><td>${v.quay}</td><td>${tag('ph-' + v.phase, v.phase)}${v.wait ? ` <span class="note">${esc(v.wait)}</span>` : ''}</td><td>${fmt(v.eta)}</td>
        <td>${v.ata != null ? fmt(v.ata) : ''}</td><td>${v.atd != null ? fmt(v.atd) : ''}</td><td class="num">${disch}</td><td class="num">${load}</td><td>${planTxt}</td>${actions ? `<td>${act}</td>` : ''}</tr>`;
    }).join('') + '</table>';
}
function unitSummary(units) {
  const states = ['ON_VESSEL', 'AT_GATE', 'YARD', 'LOADED', 'DEPARTED'];
  return `<table class="grid"><tr><th>Category</th>${states.map(s => `<th class="num">${s}</th>`).join('')}</tr>` +
    ['IMPORT', 'EXPORT', 'EMPTY'].map(c => `<tr><td class="c-${c}">${c}</td>${states.map(s => `<td class="num">${units.filter(u => u.category === c && u.state === s).length || ''}</td>`).join('')}</tr>`).join('') + '</table>';
}
function chargeTable(list, inInvoice) {
  if (!list.length) return '<p class="note">None.</p>';
  return `<table class="grid"><tr><th>Charge</th><th>Time</th><th>Line</th><th>Unit</th><th>Event</th><th>Detail</th><th class="num">Amount</th>${inInvoice ? '<th></th>' : ''}</tr>` +
    list.map(c => `<tr><td>${c.id}</td><td>${fmt(c.time)}</td><td>${c.line}</td><td>${unitLink(c.unit)}</td><td>${c.type}</td><td>${esc(c.note)}</td><td class="num">${money(c.amount)}</td>
      ${inInvoice ? `<td>${c.type !== 'CREDIT' && !c.credited ? `<button class="sm" data-act="credit" data-id="${c.id}">Credit</button>` : c.credited ? 'credited' : ''}</td>` : ''}</tr>`).join('') + '</table>';
}

// ---------- actions ----------
const ACTIONS = {
  nav: id => { UI.page = id; UI.msg = null; },
  cycle: () => cycle(),
  day: () => { S.clock += 1440 - CYCLE_MIN; cycle(); log('SYSTEM', 'Jumped one day ahead'); },
  auto: () => {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    else autoTimer = setInterval(() => { cycle(); save(); render(); }, 700);
  },
  save: () => { save(); flash('ok', 'Saved in this browser.'); },
  reset: () => { if (autoTimer) ACTIONS.auto(); fresh(); UI.stack = null; UI.unit = null; flash('ok', 'Demo terminal reset.'); },
  arrive: id => { const v = visitById(id); if (!arrive(v)) flash('err', `${v.wait}. It can berth when that vessel departs.`); },
  start: id => startWork(visitById(id)),
  depart: id => depart(visitById(id)),
  stack: id => { UI.stack = UI.stack === id ? null : id; },
  stowOpen: id => { UI.page = 'stowage'; UI.stowVisit = id; UI.slot = null; },
  stowVisit: id => { UI.stowVisit = id; UI.slot = null; },
  bay: id => { UI.bay = id; UI.slot = null; },
  bayPrev: () => { const b = Object.keys(SHIP.bays); UI.bay = b[Math.max(0, b.indexOf(UI.bay || b[0]) - 1)]; UI.slot = null; },
  bayNext: () => { const b = Object.keys(SHIP.bays); UI.bay = b[Math.min(b.length - 1, b.indexOf(UI.bay || b[0]) + 1)]; UI.slot = null; },
  stowMode: id => { UI.stowMode = id; },
  slot: id => { UI.slot = UI.slot === id ? null : id; },
  unit: id => {
    const u = S.units[id];
    UI.unit = id;
    if (u.pos) { UI.page = 'yard'; UI.stack = u.pos; } else UI.page = 'inventory';
    UI.msg = null;
  },
  release: id => { const u = S.units[id]; u.holds = []; log('GATE', `Customs hold released on ${id}`); flash('ok', `Hold released on ${id}. It can now leave through the gate.`); },
  showGone: () => { UI.showGone = !UI.showGone; },
  showDone: () => { UI.showDone = !UI.showDone; },
  prefHelp: () => { PREFS.help = !PREFS.help; savePrefs(); },
  prefTips: () => { PREFS.tips = !PREFS.tips; savePrefs(); hideTip(); },
  invoice: () => {
    const byLine = {};
    S.charges.filter(c => !c.invoice).forEach(c => (byLine[c.line] ||= []).push(c));
    Object.entries(byLine).forEach(([line, list]) => {
      const inv = { id: 'INV' + String(++S.seq.inv).padStart(4, '0'), line, time: S.clock, items: list.map(c => c.id), total: list.reduce((s, c) => s + c.amount, 0), status: 'DRAFT' };
      list.forEach(c => { c.invoice = inv.id; });
      S.invoices.push(inv);
      log('BILL', `${inv.id} draft for ${line}: ${money(inv.total)}`);
    });
    flash('ok', `${Object.keys(byLine).length} draft invoice(s) created.`);
  },
  finalize: id => { const i = S.invoices.find(x => x.id === id); i.status = 'FINAL'; log('BILL', `${id} finalized`); },
  pay: id => { const i = S.invoices.find(x => x.id === id); i.status = 'PAID'; i.paid = S.clock; log('BILL', `Payment recorded for ${id} (${money(i.total)})`); },
  invView: id => { UI.inv = UI.inv === id ? null : id; },
  credit: id => {
    const c = S.charges.find(x => x.id === id);
    c.credited = true;
    S.charges.push({ id: 'C' + String(++S.seq.chg).padStart(4, '0'), line: c.line, unit: c.unit, type: 'CREDIT', amount: -c.amount, note: 'Credit for ' + c.id, time: S.clock, invoice: null });
    log('BILL', `Credit issued for ${c.id} (${money(-c.amount)}), goes on next invoice`);
    flash('ok', 'Credit created. It will appear on the next invoice for ' + c.line + '.');
  },
};
// outside gate hours the truck is turned away and nothing else changes (no unit is created)
function gateClosed(kind, unitId) {
  const tx = { id: 'TX' + String(++S.seq.tx).padStart(4, '0'), time: S.clock, truck: 'TRK-' + (100 + ++S.seq.truck), kind, unit: unitId,
    status: 'REJECTED', reason: 'Gate closed until ' + fmt(nextGateOpen(S.clock)) };
  S.gate.push(tx);
  log('GATE', `${tx.truck} REJECTED: ${tx.reason}`);
  flash('err', `Truck ${tx.truck} rejected: the gate is closed now (Sun-Thu 05:00-24:00, Fri 05:00-14:45, Sat closed). It opens ${fmt(nextGateOpen(S.clock))}.`);
}
const FORMS = {
  visit: f => {
    const v = addVisit(f.vessel.trim() || 'MV Unnamed', f.line, Math.round(Number(f.eta) * 60), Math.min(20, Math.max(0, Number(f.imports) | 0)),
      QUAYS.some(q => q.id === f.quay) ? f.quay : '27');
    log('VESSEL', `Visit ${v.id} ${v.vessel} created for quay ${v.quay}, ETA ${fmt(v.eta)}`);
    flash('ok', `Visit ${v.id} created.`);
  },
  gatein: f => {
    if (!isGateOpen(S.clock)) return gateClosed('RECEIVE ' + f.kind, null);
    if (f.kind === 'EXPORT' && !f.visit) { flash('err', 'Export needs an open vessel visit.'); return; }
    const u = addUnit({ line: f.line, category: f.kind, iso: f.iso, visit: f.kind === 'EXPORT' ? f.visit : null, state: 'AT_GATE',
      pod: f.kind === 'EXPORT' ? Math.min(3, Math.max(1, Number(f.pod) | 0)) : null });
    if (f.kind === 'EMPTY') u.weight = 2.2;
    const tx = { id: 'TX' + String(++S.seq.tx).padStart(4, '0'), time: S.clock, truck: 'TRK-' + (100 + ++S.seq.truck), kind: 'RECEIVE ' + f.kind, unit: u.id, status: 'PLANNED' };
    tx.wi = newWI('GATE_IN', u).id;
    S.gate.push(tx);
    log('GATE', `${tx.truck} in with ${u.id} (${f.kind}), ${tx.wi} created`);
    flash('ok', `Truck ${tx.truck} accepted with ${u.id}. Run a cycle to stack it.`);
  },
  gateout: f => {
    const u = S.units[f.unit];
    if (!u) return;
    if (!isGateOpen(S.clock)) return gateClosed('DELIVER ' + u.category, u.id);
    const tx = { id: 'TX' + String(++S.seq.tx).padStart(4, '0'), time: S.clock, truck: 'TRK-' + (100 + ++S.seq.truck), kind: 'DELIVER ' + u.category, unit: u.id };
    S.gate.push(tx);
    if (u.holds.length) {
      tx.status = 'REJECTED'; tx.reason = 'Hold: ' + u.holds.join(', ');
      log('GATE', `${tx.truck} REJECTED for ${u.id}: ${tx.reason}`);
      flash('err', `Truck rejected: ${u.id} has a ${u.holds.join(', ')} hold. Release it in Unit Inventory first.`);
      return;
    }
    tx.status = 'PLANNED';
    tx.wi = newWI('GATE_OUT', u).id;
    log('GATE', `${tx.truck} in for pickup of ${u.id}, ${tx.wi} created`);
    flash('ok', `Pickup accepted. ${tx.wi} sent to the yard crane queue.`);
  },
  tariff: f => {
    for (const k of ['lift', 'gateFee', 'storagePerDay', 'freeDays']) S.tariff[k] = Math.max(0, Number(f[k]) || 0);
    log('BILL', 'Tariffs updated');
    flash('ok', 'Tariffs saved.');
  },
};

const INFO_SEL = 'th, .tag, legend, .kpi, .legend span, h3, .lblock, .quay, .sea, .rail, .lane > span, .eqname, .pstatus';
function infoTip(el) {
  const txt = (el.matches('.kpi') ? el.querySelector('span').textContent : el.textContent).trim();
  const dict = INFO[el.matches('th') ? 'th' : el.matches('.tag') ? 'tag' : 'part'];
  if (txt in dict) return dict[txt];
  const k = Object.keys(dict).filter(k => k && txt.startsWith(k)).sort((a, b) => b.length - a.length)[0];
  return k ? dict[k] : '';
}

let tipFor = null;
function showTip(el) {
  const text = PREFS.tips && tipText(el);
  if (!text) return hideTip();
  const tip = $('tip');
  tip.textContent = text;
  tip.hidden = false;
  tipFor = el;
  el.setAttribute('aria-describedby', 'tip');
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const left = Math.min(Math.max(4, r.left), innerWidth - w - 4);
  const top = r.bottom + 6 + h > innerHeight ? r.top - h - 6 : r.bottom + 6;
  tip.style.left = left + 'px';
  tip.style.top = Math.max(4, top) + 'px';
}
function hideTip() {
  $('tip').hidden = true;
  if (tipFor) tipFor.removeAttribute('aria-describedby');
  tipFor = null;
}
const tipTarget = e => e.target.closest && e.target.closest('[data-tip], [data-act], ' + INFO_SEL);
document.addEventListener('mouseover', e => { const el = tipTarget(e); if (el && el !== tipFor) showTip(el); else if (!el) hideTip(); });
document.addEventListener('focusin', e => { const el = tipTarget(e); if (el) showTip(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('scroll', hideTip, true);
document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target;
  UI.msg = null;
  FORMS[form.dataset.form](Object.fromEntries(new FormData(form)));
  save(); render();
});

if (!load()) fresh();
render();
window.TOS = { get state() { return S; }, cycle: () => { cycle(); render(); }, checkDigit };   // for tests and curious learners

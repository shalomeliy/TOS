<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOS Trainer</title>
<style>
:root{
  --face:#d4d0c8; --face-lt:#e6e3dc; --hl:#ffffff; --shadow:#808080; --dark:#404040;
  --title1:#0a246a; --title2:#3a6ea5; --sel:#316ac5; --ink:#000; --muted:#555;
  --exp:#3f8f5a; --imp:#c0702e; --mty:#8a8a8a; --hold:#c0262d; --win:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#3a6ea5;font:12px Tahoma,"Segoe UI",Verdana,sans-serif;color:var(--ink)}
.app{position:absolute;inset:6px;display:grid;grid-template-rows:auto auto auto 1fr auto auto;grid-template-columns:minmax(0,1fr);background:var(--face);
  border:1px solid;border-color:var(--hl) var(--dark) var(--dark) var(--hl);box-shadow:inset -1px -1px var(--shadow)}
.titlebar{display:flex;align-items:center;gap:6px;padding:3px 4px;color:#fff;font-weight:bold;
  background:linear-gradient(90deg,var(--title1),var(--title2))}
.titlebar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .ver{font-weight:normal;font-family:"Lucida Console",Consolas,monospace;font-size:11px;background:#0003;padding:0 6px;white-space:nowrap;cursor:help}
.wbtn{width:16px;height:14px;background:var(--face);color:#000;font:bold 9px Tahoma;display:grid;place-items:center;
  border:1px solid;border-color:var(--hl) var(--dark) var(--dark) var(--hl)}
.menubar{display:flex;gap:2px;padding:2px 4px;border-bottom:1px solid var(--shadow)}
.menubar a{padding:2px 6px;color:#000;text-decoration:none;cursor:pointer}
.menubar a:hover{background:var(--sel);color:#fff}
.menubar a u{text-decoration:underline}
#tip{position:fixed;z-index:10;max-width:280px;direction:rtl;text-align:right;background:#ffffe1;color:#000;border:1px solid #000;
  padding:4px 7px;font-size:12px;line-height:1.45;box-shadow:2px 2px 0 #0004;pointer-events:none}
#tip[hidden]{display:none}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px;border-bottom:1px solid var(--shadow);box-shadow:0 1px var(--hl)}
.sep{width:2px;height:20px;border-left:1px solid var(--shadow);border-right:1px solid var(--hl);margin:0 3px}
button{font:inherit;background:var(--face);padding:3px 10px;cursor:pointer;color:#000;
  border:1px solid;border-color:var(--hl) var(--dark) var(--dark) var(--hl);box-shadow:inset -1px -1px var(--shadow)}
button:active,button.on{border-color:var(--dark) var(--hl) var(--hl) var(--dark);box-shadow:inset 1px 1px var(--shadow)}
button:disabled{color:var(--shadow);text-shadow:1px 1px var(--hl);cursor:default}
button.sm{padding:1px 6px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:1px dotted #000;outline-offset:1px}
input,select{font:inherit;background:#fff;padding:2px 3px;border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow);box-shadow:inset 1px 1px var(--dark)}
.clock{font-family:"Lucida Console",Consolas,monospace;padding:2px 8px;background:#000;color:#3f3}
.pstate{padding:1px 6px;border:1px solid #0006;font-weight:bold;white-space:nowrap}
.ps-WORKING{background:#d4efd4}.ps-GATE-CLOSED{background:#fff3c4}.ps-SHABBAT{background:#e3d6f5}
.st-SHABBAT{background:#e3d6f5}
.layout{overflow-x:auto;display:grid;gap:4px;padding-bottom:4px}
.layout>div{min-width:max-content}
.sea{background:#9cc3e6;color:#1d3e63;padding:2px 6px}
.quays{display:flex;gap:6px}
.quay{flex:none;background:#cfd8e3;border:1px solid #7f8fa3;padding:3px 6px}
.lane{display:flex;flex-wrap:wrap;gap:4px 16px;background:#eee;border:1px dashed #999;padding:3px 6px}
.lblocks{display:flex;gap:6px}
.lblock{background:#fff;border:1px solid #bbb;padding:3px 6px;min-width:150px}
.rail{border-top:4px double #555;padding-top:2px;color:var(--muted)}
.stowwrap{display:grid;grid-template-columns:auto minmax(0,300px);gap:12px;align-items:start}
.baywrap{overflow-x:auto;min-width:0}
.baygrid{display:grid;gap:3px;background:#fff;padding:6px;border:1px solid #bbb;width:max-content}
.rowlbl,.tierlbl{font-size:10px;color:var(--muted);align-self:center;text-align:center}
.hatch{grid-column:1/-1;border-top:5px solid #333;margin:2px 0}
button.slot{height:42px;padding:1px;font-size:10px;line-height:1.25;background:#f7f7f7;box-shadow:none;border:1px solid #ccc}
button.slot.planned{border:2px dashed #333}
button.slot.on{border:2px solid #000}
button.slot.warn{border:3px solid var(--hold);font-weight:bold}
button.slot.cur{outline:2px solid var(--sel);outline-offset:1px}
.pod1,button.slot.pod1{background:#dcebfb}.pod2,button.slot.pod2{background:#8fbbe8}.pod3,button.slot.pod3{background:#2f6db0;color:#fff}
button.slot.planned{background-image:repeating-linear-gradient(45deg,#fff8 0 4px,transparent 4px 8px)}
button.slot.impslot{background:var(--imp);color:#fff}
.legend i.lg-ok{border:2px solid #2e8b57;background:#fff}.legend i.lg-no{background:#ddd;border:1px solid #bbb}
button.slot.ok{outline:3px solid #2e8b57;outline-offset:-3px}
button.slot.no{opacity:.45}
button.wait{display:block;width:100%;text-align:left;margin:2px 0;font-family:"Lucida Console",Consolas,monospace;font-size:11px}
ol.tsteps{margin:4px 0;padding-left:22px;line-height:1.7}
.tstep.done{color:#000}.tstep.now{font-weight:bold;background:#fff3c4}.tstep.todo{color:var(--muted)}
.insp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
@media (max-width:760px){.insp{grid-template-columns:minmax(0,1fr)}}
.pick{background:#e3f4e3;border:1px solid #6a6;padding:3px 6px}
.legend i.lg-planned{border:2px dashed #333;background:#fff}.legend i.lg-on{border:2px solid #000;background:#fff}.legend i.lg-warn{border:2px solid var(--hold);background:#fff}
.main{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:0;gap:4px;padding:4px}
.sunken{background:var(--win);border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow);box-shadow:inset 1px 1px var(--dark)}
nav{overflow:auto;padding:4px 2px}
nav .grp{margin:2px 0 0 0;padding:2px 4px;font-weight:bold}
nav .grp::before{content:"\25BE  ";font-size:9px}
nav a{display:block;padding:1px 4px 1px 22px;color:#000;text-decoration:none;cursor:pointer;white-space:nowrap}
nav a::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;background:var(--face);border:1px solid var(--shadow)}
nav a.cur{background:var(--sel);color:#fff}
.content{overflow:auto;padding:8px 10px;min-width:0}
h1{font-size:15px;margin:0 0 2px;cursor:help}
th,.tag,legend,.kpi,.legend span,h3,.quay,.sea,.rail,.lane>span,.eqname,.pstatus,.bbar,.bday,.btick,.bshab,.bnow,.siding{cursor:help}
h1 .q{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;font-size:11px;border:1px solid var(--shadow);border-radius:50%;background:var(--win);color:var(--muted)}
.concept{color:var(--muted);margin-bottom:6px}
.help{direction:rtl;text-align:right;background:#ffffe1;border:1px solid #a0a070;padding:5px 8px;margin:6px 0 10px;line-height:1.5}
fieldset{border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow);margin:0 0 10px;padding:6px 8px 8px}
legend{padding:0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row label{display:flex;gap:4px;align-items:center}
table.grid{border-collapse:collapse;width:100%;background:#fff;margin-bottom:10px}
.grid th{background:var(--face);text-align:left;font-weight:normal;padding:2px 6px;white-space:nowrap;position:sticky;top:0;
  border:1px solid;border-color:var(--hl) var(--dark) var(--dark) var(--hl)}
.grid td{padding:2px 6px;border-bottom:1px solid #e8e8e8;white-space:nowrap}
.grid tr:hover td{background:#eef3fb}
.grid tr.sel td{background:var(--sel);color:#fff}
.grid td.num,.grid th.num{text-align:right}
.mono{font-family:"Lucida Console",Consolas,monospace}
.tag{display:inline-block;padding:0 5px;border:1px solid #0003;font-size:11px;line-height:15px}
.st-BOOKED{background:#fff3c4}.st-USED{background:#d4efd4}.st-MISSED{background:#f7c9c9}.st-CANCELLED{background:#eee}
.aslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:4px}
.aslot{display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:11px;padding:3px 4px;text-align:left}
.aslot.on{outline:2px solid #1d4f91}.aslot.afull{background:#f7c9c9;color:#600}
.abar{display:block;height:6px;background:#fff;border:1px solid #999}.abar i{display:block;height:100%;background:#4a7bc0}.afull .abar i{background:#b33}
.st-PLANNED{background:#fff3c4}.st-DISPATCHED{background:#c8dcff}.st-COMPLETE{background:#d4efd4}
.st-REJECTED,.st-HOLD{background:#f7c9c9}.st-DRAFT{background:#eee}.st-FINAL{background:#c8dcff}.st-PAID{background:#d4efd4}
.ph-INBOUND{background:#eee}.ph-ARRIVED{background:#fff3c4}.ph-WORKING{background:#c8dcff}.ph-COMPLETE{background:#d4efd4}.ph-DEPARTED{background:#ddd;color:#666}
.c-EXPORT{color:var(--exp);font-weight:bold}.c-IMPORT{color:var(--imp);font-weight:bold}.c-EMPTY{color:var(--mty);font-weight:bold}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:10px}
.kpi{background:#fff;padding:6px 8px;border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow)}
.kpi b{display:block;font-size:20px;font-weight:normal;font-family:"Lucida Console",Consolas,monospace}
.kpi span{color:var(--muted)}
.flash{padding:5px 8px;margin-bottom:8px;border:1px solid}
.flash.ok{background:#e3f4e3;border-color:#6a6}.flash.err{background:#fbe0e0;border-color:#c66}
.yardwrap{display:grid;grid-template-columns:1fr 280px;gap:10px;align-items:start}
.blocks{display:flex;flex-wrap:wrap;gap:10px}
.block{background:#fff;padding:4px 6px 6px;border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow)}
.block h3{margin:0 0 4px;font-size:12px}
.bgrid{display:grid;gap:3px}
.stack{width:44px;height:58px;padding:2px;background:#f2f2f2;border:1px solid #bbb;cursor:pointer;display:flex;flex-direction:column-reverse;gap:1px;position:relative}
.stack:hover{border-color:#000}
.stack.cur{outline:2px solid var(--sel);outline-offset:1px}
.tier{height:11px;border:1px solid #0004}
.tier.EXPORT{background:var(--exp)}.tier.IMPORT{background:var(--imp)}.tier.EMPTY{background:var(--mty)}
.tier.held{background-image:repeating-linear-gradient(45deg,transparent 0 3px,var(--hold) 3px 5px)}
.stack .lbl{position:absolute;top:1px;left:2px;font-size:9px;color:#666}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 10px}
.legend i{display:inline-block;width:12px;height:10px;margin-right:4px;vertical-align:-1px;border:1px solid #0004}
.logpane{margin:0 4px 4px;height:92px;overflow:auto;padding:2px 6px;font-family:"Lucida Console",Consolas,monospace;font-size:11px}
.logpane div{white-space:nowrap}
.statusbar{display:flex;gap:2px;padding:2px;overflow:hidden}
.statusbar span{padding:1px 6px;border:1px solid;border-color:var(--shadow) var(--hl) var(--hl) var(--shadow);white-space:nowrap}
.statusbar span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis}
.map td{white-space:normal;vertical-align:top;line-height:1.45}
.rtl{direction:rtl;text-align:right}
.note{color:var(--muted)}
.btl{display:grid;grid-template-columns:64px max-content;gap:3px 4px;align-items:center}
.blbl{font-weight:bold;cursor:help}
.bscale{position:relative;height:30px}
.bday{position:absolute;top:0;height:15px;border-left:1px solid #888;padding-left:3px;font-weight:bold;white-space:nowrap;overflow:hidden}
.btick{position:absolute;top:15px;font-size:10px;color:var(--muted);padding-left:2px;border-left:1px solid #bbb;white-space:nowrap}
.btrack{position:relative;height:46px;border:1px solid #bbb;background:linear-gradient(90deg,#e4e4e4 1px,transparent 1px) 0 0/168px 100% #fff}
.bshab{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#e3d6f5 0 4px,#efe7fa 4px 8px)}
.bnow{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--hold)}
.bbar{position:absolute;height:19px;line-height:17px;font-size:11px;padding:0 4px;border:1px solid #0006;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbar.ph-INBOUND{background:#fff;border-style:dashed}
.bbar.bconf{border:2px solid var(--hold);font-weight:bold}
.cars{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;padding:6px;background:#fff;border:1px solid #bbb;border-bottom:4px double #555;width:max-content;max-width:100%}
.car{width:132px;cursor:help;background:#d9d2c3;border:1px solid #7a6f5c;padding:2px 3px 3px}
.car b{display:block;font-size:10px;font-weight:normal;color:#4a4232}
.cslots{display:flex;gap:2px;height:28px}
.rbox{flex:1;font-size:9px;line-height:12px;padding:1px 2px;overflow:hidden;color:#fff;border:1px solid #0006;font-family:"Lucida Console",Consolas,monospace}
.rbox.s40{flex:2}.rbox.EXPORT{background:var(--exp)}.rbox.IMPORT{background:var(--imp)}.rbox.EMPTY{background:var(--mty)}
.rbox.planned{background:#fff;color:#000;border:2px dashed #333}.rbox.free{background:transparent;border:1px dotted #998f7a}
.legend i.lg-rplan{border:2px dashed #333;background:#fff}
.legend i.lg-shab{background:#e3d6f5}.legend i.lg-now{border:0;border-left:2px solid var(--hold);width:4px}.legend i.lg-conf{border:2px solid var(--hold);background:#fff}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)}
  nav{max-height:130px}
  .yardwrap,.stowwrap{grid-template-columns:minmax(0,1fr)}
  .app{inset:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar"><span class="t">TOS Trainer &mdash; N4-style Terminal Operating System (educational simulator)</span>
    <span class="ver" id="appVer" data-tip="מספר הגרסה של הסימולטור ותאריך העדכון. אם המספר כאן תואם למה שכתבתי לך בהודעה, השדרוג עבר בהצלחה. המספר הראשון הוא הגרסה במפת הדרכים, והמספר אחרי הנקודה הוא מספר התיקון בתוכה."></span>
    <span class="wbtn" aria-hidden="true">_</span><span class="wbtn" aria-hidden="true">&#9633;</span><span class="wbtn" aria-hidden="true">x</span></div>
  <div class="menubar">
    <a data-act="nav" data-id="settings" tabindex="0"><u>F</u>ile</a><a data-act="nav" data-id="vessels" tabindex="0"><u>V</u>essel</a><a data-act="nav" data-id="yard" tabindex="0"><u>Y</u>ard</a><a data-act="nav" data-id="gate" tabindex="0"><u>G</u>ate</a><a data-act="nav" data-id="work" tabindex="0"><u>C</u>ontrol</a><a data-act="nav" data-id="billing" tabindex="0"><u>B</u>illing</a><a data-act="nav" data-id="mapping" tabindex="0"><u>H</u>elp</a></div>
  <div class="toolbar">
    <span class="clock" id="clock" data-tip="השעון של הנמל המדומה: יום בשבוע, תאריך ושעה. הוא זז רק כשאתה מריץ סבבים."></span>
    <span class="pstate" id="portState" data-tip="מה מותר בנמל עכשיו. WORKING = עובדים והשער פתוח. GATE CLOSED = העגורנים עובדים, אבל השער סגור למשאיות. SHABBAT = משישי 15:00 עד מוצאי שבת 20:00 שום מכונה לא מקבלת עבודה חדשה."></span>
    <button data-act="cycle">Run 1 cycle (15 min)</button>
    <button data-act="auto" id="autoBtn">Auto-run</button>
    <button data-act="day">+1 day</button>
    <span class="sep"></span>
    <button data-act="save">Save</button>
    <button data-act="reset">Reset demo</button>
  </div>
  <div class="main">
    <nav class="sunken" id="nav"></nav>
    <div class="content sunken" id="content"></div>
  </div>
  <div class="logpane sunken" id="log" aria-label="Event log"></div>
  <div class="statusbar" id="status"></div>
</div>
<div id="tip" role="tooltip" hidden></div>

<script>
'use strict';
// ---------- constants ----------
const KEY = 'tos-trainer-v1';
const T0 = Date.UTC(2026, 9, 22, 6, 0);           // simulation start, shown in UTC
const CYCLE_MIN = 15, MAX_TIER = 4;
const BLOCKS = [
  { id: 'A', use: ['EXPORT'], bays: 6, rows: 2 },
  { id: 'B', use: ['EXPORT'], bays: 6, rows: 2 },
  { id: 'C', use: ['IMPORT'], bays: 6, rows: 2 },
  { id: 'D', use: ['IMPORT', 'EMPTY'], bays: 6, rows: 2 },
];
// Ashdod South Port (HCT) scaled down x4: real 800 m / 445 m quays, 8 quay cranes, 30 ASCs (docs/research/ashdod-south-port.md)
const QUAYS = [{ id: '27', len: 200, real: 800 }, { id: '28', len: 111, real: 445 }];
// shown top right; bump on every push: <roadmap version>.<fix number inside it>
const APP_VERSION = 'v8.0', APP_DATE = '27-10-2026';
const STATE_VER = 8;                             // bump when the saved shape changes, and add a MIGRATE step
// truck appointments: one-hour slots; a truck is on time from APPT_GRACE minutes before its hour to APPT_GRACE after it ends
const APPT_GRACE = 30, APPT_KINDS = { 'RECEIVE EXPORT': 'Bring an export', 'RECEIVE EMPTY': 'Return an empty', DELIVER: 'Pick up an import' };
// each line sails a fixed route: the 3 ports after Ashdod (UN/LOCODE). POD 1 = first stop, 3 = last stop
const ROUTES = { BLU: ['GRPIR', 'ITGOA', 'ESVLC'], RED: ['TRMER', 'GRPIR', 'NLRTM'], GRN: ['EGPSD', 'ITGOA', 'GBFXT'] };
const PORTS = { GRPIR: 'Piraeus', ITGOA: 'Genoa', ESVLC: 'Valencia', TRMER: 'Mersin', NLRTM: 'Rotterdam', EGPSD: 'Port Said', GBFXT: 'Felixstowe' };
// one ship layout for every vessel: 20' bays 01 and 03, 40' bay 06; 4 rows; tiers 02, 04 in the hold, 82, 84 on deck
const SHIP = { bays: { '01': '20', '03': '20', '06': '40' }, rows: 4, tiers: ['02', '04', '82', '84'] };
const DAYS = ['Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed'];   // T0 is Thursday 06:00 port time
const LINES = { BLU: 'Blue Ocean Lines', RED: 'Red Anchor Shipping', GRN: 'Green Wave Carriers' };
const OWNER = { BLU: 'BOLU', RED: 'RASU', GRN: 'GWCU' };
const ISO = { '22G1': "20' dry", '45G1': "40' high cube", '22R1': "20' reefer" };
const PAGES = [
  ['Terminal', [['overview', 'Overview']]],
  ['Vessel', [['vessels', 'Vessel Visits'], ['berth', 'Berth Schedule'], ['stowage', 'Stowage Plan']]],
  ['Yard', [['yard', 'Yard View'], ['inventory', 'Unit Inventory'], ['inspector', 'Unit Inspector']]],
  ['Gate', [['gate', 'Gate Transactions'], ['appts', 'Truck Appointments']]],
  ['Rail', [['rail', 'Train Visits']]],
  ['Control', [['work', 'Work Queues'], ['equipment', 'Equipment (ECS)']]],
  ['Billing', [['billing', 'Charges & Invoices']]],
  ['Help', [['mapping', 'How it maps to N4'], ['settings', 'Settings']]],
];
// Hebrew tooltips for every clickable thing, keyed by data-act (nav links by page id)
const PAGE_TIPS = {
  overview: 'מסך הסיכום: כמה מכולות יש, כמה עבודה פתוחה, וכמה כסף נכנס.',
  vessels: 'רשימת האוניות: יצירת אונייה חדשה, הגעה לרציף, התחלת עבודה ויציאה.',
  berth: 'לוח הרציפים: איזו אונייה עוגנת באיזה רציף ומתי, וכמה עגורני רציף כל אונייה מקבלת.',
  stowage: 'תוכנית ההעמסה: איזו מכולה עולה לאיזה מקום באונייה, ולמה. כאן גם מתרגלים תכנון בעצמך.',
  yard: 'מפת החצר: איפה כל מכולה עומדת. לחיצה על ערימה מראה מה בתוכה.',
  inventory: 'רשימת כל המכולות עם הפרטים שלהן. כאן משחררים עיכוב מכס.',
  inspector: 'מכולה אחת לעומק: מי היא, כל הביקורים שלה בנמל, ושלבי החיים של כל ביקור.',

  const other = trainHolder(t);
  const wait = !isWorkTime(S.clock) ? 'Shabbat: no trains until Sat 20:00' : other ? `Waiting for the siding (${other.name})` : null;
  if (wait) {
    if (t.wait !== wait) log('RAIL', `${t.name} (${t.id}) ${wait.toLowerCase()}`);
    t.wait = wait;
    return false;
  }
  t.wait = null; t.phase = 'ARRIVED'; t.ata = S.clock;
  log('RAIL', `${t.name} (${t.id}) arrived on the ${SIDING.toLowerCase()}`);
  return true;
}
const bookedTo = t => Object.values(S.units).filter(u => u.train === t.id && u.category === 'IMPORT' && u.state === 'YARD');
const railReady = u => u.category === 'IMPORT' && u.state === 'YARD' && !u.train && !u.wi;
function trainStart(t) {
  let d = 0, l = 0, left = 0;
  Object.values(S.units).filter(u => u.train === t.id && u.state === 'ON_TRAIN' && !u.wi).forEach(u => { newWI('RAIL_DISCH', u, { train: t.id }); d++; });
  // 40' boxes first, so two 20' boxes do not split a car a 40' needs
  bookedTo(t).filter(u => !u.wi).sort((a, b) => sizeOf(b) - sizeOf(a)).forEach(u => {
    u.car = carFor(t, u, false);
    if (u.car) { newWI('RAIL_LOAD', u, { train: t.id }); l++; }
    else { u.train = null; left++; log('RAIL', `${u.id} does not fit on ${t.name}: no car with room, it stays in the yard`); }
  });
  t.phase = 'WORKING'; t.started = S.clock;
  log('RAIL', `${t.name}: work started, ${d} rail discharge + ${l} rail load instructions created` + (left ? `, ${left} did not fit` : ''));
  flash('ok', `${d} rail discharge and ${l} rail load work instructions created. Discharge comes first, then loading. Run cycles to execute them.` + (left ? ` ${left} box(es) did not fit on the cars.` : ''));
}
function trainDepart(t) {
  t.phase = 'DEPARTED'; t.atd = S.clock;
  let left = 0;
  Object.values(S.units).filter(u => u.train === t.id).forEach(u => {
    if (u.state === 'LOADED') { u.state = 'DEPARTED'; return; }
    // a box that never got on (a hold): its job is dropped and it stays in the yard, free to leave another way
    if (u.wi) S.wis = S.wis.filter(w => w.id !== u.wi);
    u.wi = null; u.train = null; u.car = null; left++;
  });
  log('RAIL', `${t.name} departed` + (left ? `, ${left} box(es) left behind in the yard` : ''));
}

    const visible = S.visits.filter(v => { if (v.phase === 'DEPARTED' && v.atd < w0) return false; const b = berthWindow(v); return b.to > w0 && b.from < w1; });

      <fieldset><legend>Quay crane split</legend><table class="grid"><tr><th>Quay crane</th><th>Assigned to</th><th>Status</th><th>Current WI</th><th>Move to</th></tr>${qrows}</table>
        <p class="note">A quay crane works only for the vessel it is assigned to. When a vessel finishes, its cranes go to the next working vessel.</p></fieldset>`;
  },
  stowage() {
    const open = S.visits.filter(v => v.phase !== 'DEPARTED');
    const v = open.find(x => x.id === UI.stowVisit) || open.find(x => x.phase === 'WORKING') || open[0];
    const head = header('Stowage Plan', 'Vessel planning; Vessel Autostow (automatic slot planning by rules)',

    const modes = ['pod', 'weight'].map(m => `<button class="sm ${m === mode ? 'on' : ''}" data-act="stowMode" data-id="${m}">Colour by ${m === 'pod' ? 'POD' : 'weight'}</button>`).join(' ');
    // one box face: stop or weight colour; the text always says the port and the weight (meaning not by colour alone)
    const face = u => u.category === 'IMPORT' ? { cls: ' impslot', txt: 'IMP<br>Ashdod', style: '' }
      : { cls: mode === 'pod' ? ' pod' + u.pod : '', txt: `${podCode(v, u.pod)}<br>${u.weight} t`,
        style: mode === 'pod' ? '' : ` style="background:hsl(210,70%,${Math.round(92 - (u.weight - 8) * 2.4)}%);color:${u.weight > 19 ? '#fff' : '#000'}"` };
    const boxLabel = u => `${u.id}, ${sizeOf(u)} ft${u.category === 'EXPORT' ? `, POD ${podCode(v, u.pod)}, ${u.weight} t` : ''}`;
    const getP = k => practiceAt(v, k);
    // one cell per slot; the real plan and the practice board differ only in what fills a slot
    const cell = k => {
      if (practice) {
        const u = getP(k), br = boardBreak(v, getP, k), by = v.practice[k] && v.practice[k].by;
        let cls = 'slot', txt = '', style = '';
        if (u) { const f = face(u); cls += (by === 'me' ? ' on' : ' planned') + f.cls; txt = f.txt; style = f.style; }
        const why = pick ? canPlace(v, pick, k) : null;
        if (pick) cls += why ? ' no' : ' ok';
        if (br) { cls += ' warn'; txt = '! ' + txt; }
        const label = `Slot ${k}: ${u ? boxLabel(u) + ', placed by ' + (by === 'me' ? 'you' : 'the computer') : 'empty'}` +
          (pick ? (why ? ', not allowed for the picked box' : ', allowed for the picked box') : '') + (br ? ', warning' : '');
        return `<button class="${cls}${UI.slot === k ? ' cur' : ''}" data-act="pslot" data-id="${k}" aria-label="${esc(label)}"${style}>${txt || '&nbsp;'}</button>`;
      }
      const u = unitAt(v, k), on = !!v.onboard[k], warn = ruleBreak(v, k);
      let cls = 'slot', txt = '', style = '', state = 'empty';
      if (u) { const f = face(u); state = on ? (u.category === 'IMPORT' ? 'import on board' : 'loaded') : 'planned'; cls += (on ? ' on' : ' planned') + f.cls; txt = f.txt; style = f.style; }
      // an import still on board where an export is planned: show both, the export goes in after discharge
      const next = on && v.plan && v.plan[k] && v.plan[k].unit !== v.onboard[k] ? S.units[v.plan[k].unit] : null;
      if (next) txt += `<br>then ${podCode(v, next.pod)}`;
      if (warn) { cls += ' warn'; txt = '! ' + txt; }
      const label = `Slot ${k}: ${state}${u ? ', ' + boxLabel(u) : ''}` + (next ? `, then planned ${boxLabel(next)}` : '') + (warn ? ', warning' : '');
      return `<button class="${cls}${UI.slot === k ? ' cur' : ''}" data-act="slot" data-id="${k}" aria-label="${esc(label)}"${style}>${txt || '&nbsp;'}</button>`;
    };
    // cross-section: deck tiers on top, a thick hatch line, hold tiers below
    let grid = '<div></div>' + Array.from({ length: SHIP.rows }, (_, r) => `<div class="rowlbl">Row ${String(r + 1).padStart(2, '0')}</div>`).join('');
    SHIP.tiers.slice().reverse().forEach(tier => {
      if (tier === '04') grid += '<div class="hatch" aria-hidden="true"></div>';
      grid += `<div class="tierlbl">${tier}</div>`;
      for (let r = 1; r <= SHIP.rows; r++) grid += cell(slotKey(bay, r, tier));
    });
    const inBay = UI.slot && UI.slot.startsWith(bay);
    let side = '<p class="note">Click a slot to see which box is there and why.</p>';
    const details = (u, k, status) => `<table class="grid"><tr><td>Unit</td><td>${unitLink(u.id)}</td></tr>
        <tr><td>Status</td><td>${status}</td></tr>
        ${u.category === 'EXPORT' ? `<tr><td>POD</td><td>${podCode(v, u.pod)} ${PORTS[podCode(v, u.pod)]} (stop ${u.pod} of 3)</td></tr>` : ''}
        <tr><td>Size</td><td>${sizeOf(u)}' <span class="note">(${u.iso} ${ISO[u.iso]}), bay ${k.slice(0, 2)} is a ${SHIP.bays[k.slice(0, 2)]}' bay</span></td></tr>
        <tr><td>Weight</td><td>${u.weight} t</td></tr><tr><td>Yard position</td><td class="mono">${posLabel(u)}</td></tr></table>`;
    let summary, legend;
    if (practice) {
      const waiting = editable ? practiceWaiting(v) : [], sc = boardScore(v, getP);
      summary = `Practice: placed ${sc.placed} / ${sc.placed + waiting.length}, rule breaks ${sc.port + sc.weight} (port order ${sc.port}, weight ${sc.weight}), extra moves at later ports ${sc.extra}`;
      side = '';
      if (pick) side += `<p class="pick">Picked: <b>${pick.id}</b>, ${sizeOf(pick)}', stop ${pick.pod} ${podCode(v, pick.pod)}, ${pick.weight} t <button class="sm" data-act="pcancel">Cancel</button></p><p class="note">Green slots are allowed for this box, grey ones are not. Click a slot to place it.</p>`;
      else if (inBay && getP(UI.slot)) {
        const u = getP(UI.slot), br = boardBreak(v, getP, UI.slot);
        side += `<b>Slot ${UI.slot}</b> <span class="note">(bay-row-tier)</span>` + details(u, UI.slot, v.practice[UI.slot].by === 'me' ? 'Placed by you (practice)' : 'Placed by the computer (practice)') +
          (br ? `<p class="flash err rtl">${esc(br.he)}</p>` : '<p class="rtl note">המקום הזה לא שובר אף חוק.</p>') +
          (editable ? `<p><button class="sm" data-act="premove" data-id="${UI.slot}">Remove</button></p>` : '');
      } else if (editable) side += '<p class="note">Pick a box from the list, then click a slot.</p>';
      if (editable) side += `<fieldset><legend>Waiting to be placed (${waiting.length})</legend>` + (waiting.length ? waiting
        .map(u => `<button class="sm wait ${UI.pick === u.id ? 'on' : ''}" data-act="ppick" data-id="${u.id}">${u.id} &middot; ${sizeOf(u)}' &middot; stop ${u.pod} ${podCode(v, u.pod)} &middot; ${u.weight} t</button>`).join('')
        : '<p class="note">Every box is placed.</p>') + '</fieldset>';
      if (UI.compare) {
        const auto = boardScore(v, autoBoard(v));
        const row = (who, r) => `<tr><td>${who}</td><td class="num">${r.placed}</td><td class="num">${r.port}</td><td class="num">${r.weight}</td><td class="num">${r.extra}</td></tr>`;
        side += `<fieldset><legend>Compare with the automatic plan</legend><table class="grid"><tr><th>Who planned</th><th class="num">Boxes</th><th class="num">Port-order breaks</th><th class="num">Weight breaks</th><th class="num">Extra moves</th></tr>${row('You', sc)}${row('Computer', auto)}</table>
          <p class="rtl note">${sc.extra > auto.extra ? `התוכנית שלך תגרום ל-${sc.extra - auto.extra} הזזות מיותרות יותר מהתוכנית של המחשב בנמלים הבאים. כל הזזה כזו היא עגורן שמרים מכולה הצידה ומחזיר אותה, וזה עולה זמן וכסף.` : 'כל הכבוד: התוכנית שלך לא גורמת ליותר הזזות מיותרות מהתוכנית של המחשב.'}</p></fieldset>`;
      }
      legend = `<span><i class="lg-on"></i>Placed by you (solid)</span><span><i class="lg-planned"></i>Placed by the computer (dashed)</span><span><i class="lg-warn"></i>! Warning</span>` +
        (pick ? '<span><i class="lg-ok"></i>Allowed (green)</span><span><i class="lg-no"></i>Not allowed (grey)</span>' : '');
    } else {
      const plan = v.plan || {};
      const planned = Object.keys(plan).length, loaded = Object.entries(plan).filter(([k, p]) => v.onboard[k] === p.unit).length;
      const warns = Object.keys(plan).filter(k => ruleBreak(v, k)).length;
      const short = Object.values(S.units).filter(u => u.visit === v.id && u.short).length;
      const yardReh = S.wis.filter(w => w.visit === v.id && w.kind === 'LOAD').reduce((n, w) => n + (w.rehandles || 0), 0);
      summary = v.plan ? `Planned ${planned} / Loaded ${loaded} / Warnings ${warns}` + (short ? ` / Short-shipped ${short}` : '') +
        ` &nbsp; Yard rehandles caused by this load: ${yardReh}` + (planned && loaded === planned ? ' ' + tag('st-COMPLETE', 'COMPLETE') : '')
        : practiceOpen(v) ? 'No stowage plan yet. It is built when work starts.' : 'No plan (this vessel started work before version 3).';
      if (inBay) {
        const su = unitAt(v, UI.slot);
        side = `<b>Slot ${UI.slot}</b> <span class="note">(bay-row-tier)</span>` + (su ? details(su, UI.slot, v.onboard[UI.slot] ? (su.category === 'IMPORT' ? 'On board, to discharge' : 'Loaded') : 'Planned') : '') +
          `<p class="rtl">${esc(slotReason(v, UI.slot))}</p>` + (ruleBreak(v, UI.slot) ? `<p class="flash err">${esc(ruleBreak(v, UI.slot))}</p>` : '');
      }
      legend = '<span><i class="lg-planned"></i>Planned (dashed)</span><span><i class="lg-on"></i>On board (solid)</span><span><i class="lg-warn"></i>! Warning</span>';
    }
    legend += mode === 'pod' ? '<span><i class="pod1"></i>Stop 1</span><span><i class="pod2"></i>Stop 2</span><span><i class="pod3"></i>Stop 3</span>' : '<span>Darker = heavier</span>';
    // practice controls: start a board on a vessel that is not working yet, switch views, fill, clear, compare
    let pbar = '';
    if (!v.practice && practiceOpen(v)) pbar = '<button data-act="pstart">Plan it myself (practice)</button>';
    if (v.practice) {
      pbar = ['plan', 'practice'].map(m => `<button class="sm ${(m === 'practice') === practice ? 'on' : ''}" data-act="pview" data-id="${m}">${m === 'plan' ? 'Real plan' : 'My practice board'}</button>`).join(' ');
      if (editable) pbar += ' &nbsp; <button class="sm" data-act="pfill">Let the computer plan the rest</button> <button class="sm" data-act="pclear">Clear practice</button>';
      if (practice) pbar += ` <button class="sm ${UI.compare ? 'on' : ''}" data-act="pcompare">Compare with the automatic plan</button>`;
      if (practice && !editable) pbar += ' <span class="note">Read-only: work on this vessel has started, so practice is closed.</span>';
    }
    const route = ROUTES[v.line].map((c, i) => `${i + 1}. ${c} ${PORTS[c]}`).join(' &rarr; ');
    return head + `<p>${visits}</p>
      <p><b>${esc(v.vessel)}</b> (${v.id}, ${v.line}, quay ${v.quay}, ${v.phase}). Route after Ashdod: ${route}</p>
      ${pbar ? `<p>${pbar}</p>` : ''}
      <p class="pstatus">${summary}</p>
      <p>${bayBtns} &nbsp; ${modes}</p>
      <div class="stowwrap"><div class="baywrap"><div class="baygrid" style="grid-template-columns:34px repeat(${SHIP.rows},62px)">${grid}</div>
      <div class="legend">${legend}</div></div>
      <div>${side}</div></div>`;
  },
  yard() {
    const sel = UI.stack;
    const blocks = BLOCKS.map(b => {
      let cells = '';
      for (let row = 1; row <= b.rows; row++) for (let bay = 1; bay <= b.bays; bay++) {
        const key = stackKey(b.id, bay, row);
        const tiers = S.stacks[key].map(id => { const u = S.units[id]; return `<div class="tier ${u.category} ${u.holds.length ? 'held' : ''}" title="${id}"></div>`; }).join('');
        cells += `<div class="stack ${sel === key ? 'cur' : ''}" data-act="stack" data-id="${key}" title="${key}: ${S.stacks[key].length}/${MAX_TIER}"><span class="lbl">${String(bay).padStart(2, '0')}-${row}</span>${tiers}</div>`;
      }
      return `<div class="block"><h3>Block ${b.id} <span class="note">(${b.use.join(' + ')})</span></h3>
        <div class="bgrid" style="grid-template-columns:repeat(${b.bays},44px)">${cells}</div></div>`;
    }).join('');
    let side = '<p class="note">Click a stack to see what is inside.</p>';
    if (sel) {
      const st = S.stacks[sel];
      side = `<b>Stack ${sel}</b> (${st.length}/${MAX_TIER} tiers)<table class="grid"><tr><th>Tier</th><th>Unit</th><th>Cat.</th><th>Vessel</th></tr>` +
        st.map((id, i) => { const u = S.units[id]; return { i, u }; }).reverse().map(({ i, u }) =>
          `<tr><td>T${i + 1}</td><td>${unitLink(u.id)}${u.holds.length ? ' ' + tag('st-HOLD', 'HOLD') : ''}</td><td class="c-${u.category}">${u.category}</td><td>${u.visit ? esc(visitById(u.visit)?.vessel || u.visit) : '-'}</td></tr>`).join('') +
        '</table><p class="note">Top of the stack is first. To take out a lower box, the crane must first move everything above it (a rehandle).</p>';
    }
    return header('Yard View', 'Yard blocks, stacks and tiers; Expert Decking (rule-based slot choice)',
      'החצר מחולקת לבלוקים, וכל בלוק לערימות. כל ריבוע קטן הוא מכולה, והערימה בגובה עד 4. ירוק = ייצוא, כתום = יבוא, אפור = ריקה, פסים אדומים = עיכוב מכס. המערכת בוחרת מקום לבד לפי חוק פשוט: מכולות של אותה אונייה נערמות יחד, כדי שבהעמסה לא יצטרכו לחפור.') +
      `<div class="legend"><span><i style="background:var(--exp)"></i>Export</span><span><i style="background:var(--imp)"></i>Import</span><span><i style="background:var(--mty)"></i>Empty</span><span><i class="tier held" style="background-color:var(--imp)"></i>On hold</span></div>
      <div class="yardwrap"><div class="blocks">${blocks}</div><div>${side}</div></div>`;
  },
  inspector() {
    const head = header('Unit Inspector', 'Unit (the container) vs Unit Facility Visit, UFV (one stay in the terminal); transit state',
      'ב-N4 יש הבדל בין "המכולה" לבין "הביקור שלה". המכולה (Unit) היא הקופסה עצמה: מספר, בעלים וסוג. אלה לא משתנים לעולם. הביקור (Unit Facility Visit, UFV) הוא כל פעם שהמכולה נמצאת בנמל: איך הגיעה, לאן היא הולכת, איפה היא עכשיו ומתי. מכולה שיוצאת וחוזרת אחרי חודש שומרת את המספר שלה ומקבלת ביקור חדש. לכל ביקור יש 7 שלבי חיים (transit state): ADVISED צפויה, INBOUND על אונייה ליד הרציף, EC/IN בכניסה, YARD בחצר, EC/OUT ביציאה, LOADED הועמסה, DEPARTED עזבה.');
    const u = S.units[UI.unit];
    const search = `<form class="row" data-form="usearch"><label data-tip="הקלד מספר מכולה (או חלק ממנו) כדי למצוא אותה. אפשר גם ללחוץ על מספר מכולה בכל מסך.">Container number <input name="q" value="${esc(UI.q || '')}" maxlength="11" style="width:120px"></label>
      <button data-tip="מחפש את המכולה ומציג אותה.">Find</button>${u ? ' <button type="button" class="sm" data-act="unitList">Back to the list</button>' : ''}</form>`;
    if (!u) {
      const q = (UI.q || '').toUpperCase();
      const list = Object.values(S.units).filter(x => !q || x.id.includes(q));
      return head + search + `<fieldset><legend>All containers (${list.length}), including those that left</legend><table class="grid"><tr><th>Unit</th><th>Line</th><th>Cat.</th><th>Transit state</th><th class="num">Visits</th></tr>` +
        list.map(x => `<tr><td>${unitLink(x.id)}</td><td>${x.line}</td><td class="c-${x.category}">${x.category}</td><td>${x.transit || '-'}</td><td class="num">${(x.visits || []).length}</td></tr>`).join('') + '</table></fieldset>';
    }
    const visits = u.visits || [];
    const sel = visits[UI.ufv ?? visits.length - 1] ? (UI.ufv ?? visits.length - 1) : visits.length - 1, ufv = visits[sel];
    const unitBlock = `<fieldset><legend>Unit (the container itself, never changes)</legend><table class="grid">
      <tr><td>Number</td><td class="mono">${u.id}</td></tr>
      <tr><td>Owner</td><td>${u.id.slice(0, 4)} &middot; ${u.line} ${LINES[u.line]}</td></tr>
      <tr><td>Type</td><td>${u.iso} ${ISO[u.iso]} (${sizeOf(u)}')</td></tr></table>
      ${u.pos ? `<p><button class="sm" data-act="unitYard" data-id="${u.id}">Show in yard</button></p>` : ''}</fieldset>`;
    const vrows = visits.map((x, i) => ({ x, i })).reverse().map(({ x, i }) => `<tr class="${i === sel ? 'sel' : ''}"><td class="mono">${x.id}</td><td>${x.category}</td><td>${esc(x.inBy)}</td><td>${esc(x.outBy || '-')}</td>
      <td>${fmt(x.inTime)}</td><td>${x.outTime != null ? fmt(x.outTime) : '-'}</td><td>${x.steps.length ? x.steps[x.steps.length - 1].state : '-'}</td>
      <td>${i === sel ? '' : `<button class="sm" data-act="ufv" data-id="${i}">Show</button>`}</td></tr>`).join('');
    const visitsBlock = `<fieldset><legend>Visits (UFV): every stay in the port, newest first</legend><table class="grid"><tr><th>UFV</th><th>Category</th><th>Came by</th><th>Left by</th><th>In</th><th>Out</th><th>Last state</th><th></th></tr>${vrows}</table></fieldset>`;
    // life cycle: the 7 transit states, each "reached at", "now" or "not yet", as text (not colour alone)
    const last = ufv && ufv.steps.length ? ufv.steps[ufv.steps.length - 1].state : null;
    const steps = TRANSIT.map(t => {
      const hit = ufv && [...ufv.steps].reverse().find(st => st.state === t);
      const now = t === last && !(ufv && ufv.outTime != null);
      return `<li class="tstep ${now ? 'now' : hit ? 'done' : 'todo'}">${t} &ndash; ${now ? 'now, since ' + fmt(hit.time) : hit ? 'reached ' + fmt(hit.time) : 'not yet'}</li>`;
    }).join('');
    // moves and charges carry their visit id; older ones (before version 5) are matched by time
    const inVisit = (x, t) => ufv && (x.ufv ? x.ufv === ufv.id : t >= ufv.inTime && (ufv.outTime == null || t <= ufv.outTime));
    const moves = S.wis.filter(w => w.unit === u.id && inVisit(w, w.created));
    const chg = S.charges.filter(c => c.unit === u.id && inVisit(c, c.time));
    const lifeBlock = `<fieldset><legend>Life cycle of ${ufv ? ufv.id : '-'} (transit state)</legend><ol class="tsteps">${steps}</ol>
      ${ufv && ufv.legacy ? '<p class="note">This visit was saved before version 5, so the steps before that are not known.</p>' : ''}</fieldset>
      <fieldset><legend>Moves in this visit</legend>${moves.length ? `<table class="grid"><tr><th>WI</th><th>Kind</th><th>From</th><th>To</th><th>Status</th><th>Done</th></tr>` +
        moves.map(w => `<tr><td>${w.id}</td><td>${w.kind}</td><td class="mono">${esc(w.from || '')}</td><td class="mono">${esc(wiTo(w))}</td><td>${tag('st-' + w.status, w.status)}</td><td>${w.done != null ? fmt(w.done) : ''}</td></tr>`).join('') + '</table>' : '<p class="note">None.</p>'}</fieldset>
      <fieldset><legend>Charges in this visit</legend>${chg.length ? chargeTable(chg) : '<p class="note">None.</p>'}</fieldset>`;
    return head + search + `<div class="insp">${unitBlock}${visitsBlock}</div>${lifeBlock}`;
  },
  inventory() {
    const units = Object.values(S.units).filter(u => u.state !== 'DEPARTED' || UI.showGone);
    return header('Unit Inventory', 'Units (containers) with category, freight kind, position, holds',
      'כל מכולה במערכת. המספר שלה בנוי כמו מספר אמיתי: 4 אותיות של הבעלים, 6 ספרות, וספרת ביקורת בסוף (מחושבת בנוסחה של תקן ISO 6346). כאן גם משחררים עיכוב מכס, ורואים כמה ימים המכולה כבר בחצר וכמה אחסנה היא צוברת.') +
      `<p><label><input type="checkbox" data-act="showGone" ${UI.showGone ? 'checked' : ''}> Show departed units</label></p>
      <table class="grid"><tr><th>Unit</th><th>Type</th><th>Cat.</th><th>Line</th><th>Vessel visit</th><th>Train</th><th>Transit state</th><th>Position</th><th class="num">Tons</th><th class="num">Days</th><th class="num">Storage so far</th><th>Holds</th><th>Open WI</th></tr>` +
      units.map(u => `<tr class="${UI.unit === u.id ? 'sel' : ''}"><td>${unitLink(u.id)}</td><td>${u.iso} <span class="note">${ISO[u.iso]}</span></td><td class="c-${u.category}">${u.category}</td>
        <td>${u.line}</td><td>${u.visit ? esc(visitById(u.visit)?.vessel || '') + ' ' + u.visit : '-'}</td><td>${u.train || '-'}</td><td>${u.transit || '-'}</td><td class="mono">${posLabel(u)}</td>
        <td class="num">${u.weight}</td><td class="num">${u.inTime != null ? daysIn(u) : '-'}</td><td class="num">${u.inTime != null ? money(storageDue(u)) : '-'}</td>
        <td>${u.holds.map(h => tag('st-HOLD', h) + ` <button class="sm" data-act="release" data-id="${u.id}">Release</button>`).join('')}</td><td>${u.wi || ''}</td></tr>`).join('') + '</table>';
  },
  gate() {
    const open = S.visits.filter(v => !['DEPARTED'].includes(v.phase));
    const pickups = Object.values(S.units).filter(u => u.state === 'YARD' && !u.wi && u.category !== 'EXPORT' && !u.train);
    const recv = S.appts.filter(a => a.status === 'BOOKED' && a.kind !== 'DELIVER').sort((a, b) => a.slot - b.slot);
    const pickAppt = u => S.appts.find(a => a.status === 'BOOKED' && a.unit === u.id);
    return header('Gate Transactions', 'Gate: truck visits, receive export / deliver import, hold checks',
      'בשער נכנסות משאיות. משאית שמביאה מכולת ייצוא (Receive) צריכה לציין לאיזו אונייה היא מיועדת. משאית שבאה לקחת מכולת יבוא (Deliver) תידחה אם יש על המכולה עיכוב מכס. כל משאית צריכה תור (Appointment) שהוזמן מראש במסך Truck Appointments: משאית בלי תור, או שהגיעה יותר מחצי שעה לפני או אחרי השעה שלה, נדחית. אחרי שהשער מאשר, נוצרת משימה לעגורן החצר. שעות השער כמו בנמל הדרום: ראשון עד חמישי 05:00-24:00, שישי 05:00-14:45, שבת סגור. משאית שמגיעה מחוץ לשעות נדחית, ורואים בטבלה מתי השער ייפתח.') +
      `<fieldset><legend>Receive (gate in)</legend><form class="row" data-form="gatein">
        <label data-tip="ייצוא = מכולה מלאה שתעלה על אונייה. ריקה = מכולה ריקה שחוזרת לנמל.">Type <select name="kind"><option value="EXPORT">Export full, booked to vessel</option><option value="EMPTY">Empty return</option></select></label>
        <label data-tip="לאיזו אונייה מכולת הייצוא מיועדת.">Vessel visit <select name="visit">${open.map(v => `<option value="${v.id}">${v.id} ${esc(v.vessel)} (${v.phase})</option>`).join('')}</select></label>
        <label data-tip="לאיזה נמל מכולת הייצוא נוסעת: תחנה 1, 2 או 3 במסלול של האונייה. תחנה 3 היא האחרונה, ולכן מכולה כזו תעמוד למטה באונייה. למכולה ריקה זה לא משנה.">POD <select name="pod">${[1, 2, 3].map(p => `<option value="${p}">Stop ${p}${open[0] ? ' (' + open.map(v => v.id + ' ' + podCode(v, p)).join(', ') + ')' : ''}</option>`).join('')}</select></label>
        <label data-tip="מכולה שכבר הייתה בנמל ויצאה, וחוזרת עכשיו ריקה: בחר אותה, והיא תחזור עם אותו מספר ותקבל ביקור חדש. New number = מכולה שלא הייתה כאן. רק ל-Empty return.">Returning container <select name="ret"><option value="">New number</option>${Object.values(S.units).filter(u => u.state === 'DEPARTED').map(u => `<option value="${u.id}">${u.id} (${u.line}, left ${fmt(curVisit(u)?.outTime ?? u.outTime ?? 0)})</option>`).join('')}</select></label>
        <label data-tip="התור שהמשאית הזמינה מראש: מספר התור, מספר המשאית ובאיזו שעה. No appointment = משאית שבאה בלי תור, והשער ידחה אותה (אלא אם ביטלו את החובה במסך Truck Appointments).">Appointment <select name="appt">${recv.map(a => `<option value="${a.id}">${a.id} ${a.truck} ${APPT_KINDS[a.kind]}, ${slotLabel(a.slot).slice(4)}</option>`).join('')}<option value="">No appointment</option></select></label>
        <label data-tip="חברת הספנות שהמכולה שייכת לה.">Line <select name="line">${Object.keys(LINES).map(l => `<option>${l}</option>`).join('')}</select></label>
        <label data-tip="סוג המכולה לפי תקן בינלאומי: 20 רגל רגילה, 40 רגל גבוהה, או 20 רגל מקוררת.">ISO <select name="iso">${Object.keys(ISO).map(i => `<option value="${i}">${i} ${ISO[i]}</option>`)}</select></label>
        <button data-tip="המשאית נכנסת עם המכולה, ונוצרת משימה לעגורן החצר להוריד אותה.">Gate in</button></form></fieldset>
      <fieldset><legend>Deliver (gate out)</legend><form class="row" data-form="gateout">
        <label data-tip="איזו מכולה המשאית באה לקחת. מכולה עם [HOLD] תידחה בשער. ליד כל מכולה כתוב אם יש למשאית שלה תור (appt ומספר) או שאין (no appointment), ואז השער ידחה אותה.">Unit to pick up <select name="unit">${pickups.map(u => `<option value="${u.id}">${u.id} ${u.category} ${u.holds.length ? '[HOLD]' : ''} @ ${posLabel(u)} ${pickAppt(u) ? '- appt ' + pickAppt(u).id + ' ' + fmt(pickAppt(u).slot).slice(-5) : '- no appointment'}</option>`).join('')}</select></label>
        <button data-tip="השער בודק את המכולה. אם אין עיכוב, נוצרת משימה להוציא אותה מהחצר למשאית." ${pickups.length ? '' : 'disabled'}>Gate out</button></form></fieldset>
      <table class="grid"><tr><th>Tx</th><th>Time</th><th>Truck</th><th>Appt</th><th>Type</th><th>Unit</th><th>Status</th><th>Reason / WI</th></tr>` +
      S.gate.slice().reverse().map(g => `<tr><td>${g.id}</td><td>${fmt(g.time)}</td><td class="mono">${g.truck}</td><td>${g.appt || '-'}</td><td>${g.kind}</td><td>${g.unit ? unitLink(g.unit) : '-'}</td><td>${tag('st-' + g.status, g.status)}</td><td>${esc(g.reason || g.wi || '')}</td></tr>`).join('') + '</table>';
  },
  appts() {
    const r = S.apptRule, slots = apptSlots(24), cur = slots.includes(UI.apptSlot) ? UI.apptSlot : slots.find(m => apptUsed(m) < r.cap);
    const head = header('Truck Appointments', 'Gate appointments (truck booking): hourly slots with a cap, checked at the gate',
      'נמל לא יכול לקבל את כל המשאיות באותה שעה: יהיה פקק בשער ועגורני החצר לא יספיקו. לכן כל משאית מזמינה מראש תור (Appointment) לשעה מסוימת, ולכל שעה יש מספר מקומות מוגבל. כשהשעה מלאה, צריך לבחור שעה אחרת. ' +
      `משאית יכולה להגיע עד חצי שעה לפני השעה שלה ועד חצי שעה אחרי שהיא נגמרת. למשל תור ל-10:00-11:00 = מותר להגיע בין 09:30 ל-11:30. מוקדם יותר או מאוחר יותר, השער דוחה אותה. משאית שלא הגיעה עד סוף החלון "החמיצה" את התור (MISSED). ` +
      'כדי לקחת מכולת יבוא מזמינים תור למכולה מסוימת. כדי להביא מכולה (ייצוא או ריקה) מזמינים תור בלי מכולה, ובשער בוחרים את התור. מספר המשאית נקבע כבר בהזמנה.');
    const bars = slots.map(m => {
      const n = apptUsed(m), full = n >= r.cap;
      return `<button class="aslot${full ? ' afull' : ''}${m === cur ? ' on' : ''}" data-act="apptSlot" data-id="${m}" ${full ? 'disabled' : ''}>
        <b>${fmt(m).slice(0, 10)} ${fmt(m).slice(-5)}</b><span class="abar"><i style="width:${Math.min(100, n / r.cap * 100)}%"></i></span>${n} / ${r.cap}</button>`;
    }).join('');
    const pick = apptPickups();
    const rows = S.appts.slice().sort((a, b) => b.slot - a.slot || (b.id > a.id ? 1 : -1)).map(a => `<tr><td>${a.id}</td><td>${slotLabel(a.slot)}</td><td>${APPT_KINDS[a.kind]}</td>
      <td>${a.unit ? unitLink(a.unit) : '-'}</td><td class="mono">${a.truck}</td><td>${tag('st-' + a.status, a.status)}</td><td>${a.tx || '-'}</td>
      <td>${a.status === 'BOOKED' ? `<button class="sm" data-act="apptCancel" data-id="${a.id}">Cancel</button>` : ''}</td></tr>`).join('');
    return head + `<fieldset><legend>Appointment rules</legend><form class="row" data-form="apptRule">
        <label data-tip="מסומן = השער דוחה משאית בלי תור, או שהגיעה בזמן הלא נכון. לא מסומן = כמו לפני גרסה 8: כל משאית נכנסת, גם בלי תור."><input type="checkbox" name="required" ${r.required ? 'checked' : ''}> Gate requires an appointment</label>
        <label data-tip="כמה משאיות מותר להזמין לכל שעה (1 עד 10). מספר קטן = פחות פקקים בשער, אבל משאיות צריכות לחכות לשעה פנויה.">Trucks per hour <input name="cap" type="number" min="1" max="10" value="${r.cap}" style="width:60px"></label>
        <button data-tip="שומר את החוקים. השינוי חל מעכשיו, תורים שכבר הוזמנו נשארים.">Save rules</button></form></fieldset>
      <fieldset><legend>Hourly slots (next 24 gate hours)</legend><div class="aslots">${bars || '<p class="note">The gate is closed for the coming days.</p>'}</div></fieldset>
      <fieldset><legend>Book a truck appointment</legend><form class="row" data-form="appt">
        <label data-tip="למה המשאית באה: להביא מכולת ייצוא, להחזיר מכולה ריקה, או לקחת מכולת יבוא מהחצר.">Purpose <select name="kind">${Object.entries(APPT_KINDS).map(([k, t]) => `<option value="${k}" ${k === 'DELIVER' ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <label data-tip="רק לקחת יבוא: איזו מכולה המשאית באה לקחת. ברשימה רק מכולות בחצר שאין להן עדיין תור ושלא הוזמנו לרכבת. [HOLD] = בעיכוב מכס, השער ידחה אותה עד שישחררו.">Unit to pick up <select name="unit">${pick.map(u => `<option value="${u.id}">${u.id} ${u.category} ${u.holds.length ? '[HOLD]' : ''}</option>`).join('')}</select></label>
        <label data-tip="באיזו שעה המשאית תגיע. ליד כל שעה כתוב כמה מקומות כבר תפוסים. שעה מלאה לא ניתנת לבחירה.">Hour <select name="slot">${slots.map(m => `<option value="${m}" ${m === cur ? 'selected' : ''} ${apptUsed(m) >= r.cap ? 'disabled' : ''}>${slotLabel(m)} (${apptUsed(m)}/${r.cap})</option>`).join('')}</select></label>
        <button data-tip="מזמין את התור. המשאית מקבלת מספר, והשעה שבחרת מתמלאת במקום אחד." ${slots.length ? '' : 'disabled'}>Book</button></form></fieldset>
      <fieldset><legend>Appointments</legend>${rows ? `<table class="grid"><tr><th>Appt</th><th>Hour</th><th>Purpose</th><th>Unit</th><th>Truck</th><th>Status</th><th>Gate Tx</th><th>Actions</th></tr>${rows}</table>` : '<p class="note">No appointments yet.</p>'}</fieldset>`;
  },
  rail() {
    const head = header('Train Visits', 'Rail: train visit (a carrier visit like a vessel visit), railcars, rail work queues',
      'רכבת היא כמו אונייה קטנה ביבשה. כל רכבת שמגיעה לנמל היא "ביקור רכבת" עם אותם שלבים כמו אונייה: בדרך (INBOUND), על המסילה (ARRIVED), עובדים עליה (WORKING), סיימו (COMPLETE), יצאה (DEPARTED). לרכבת יש קרונות, ובכל קרון מקום ל-40 רגל: מכולה אחת של 40 או שתיים של 20. ' +
      'הרכבת מביאה מכולות ייצוא ממרכז הארץ (שיעלו אחר כך לאונייה), ולוקחת מכולות יבוא פנימה לארץ במקום משאיות. מכולת יבוא יוצאת ברכבת רק אם הזמינו אותה לרכבת (Book). Start work יוצר משימות: קודם פורקים את הרכבת, ואחר כך מעמיסים עליה. כל הזזה עושים עגורן הרכבת (RMG01) ועגורן החצר של הבלוק. מכולה עם עיכוב מכס לא עולה לרכבת, בדיוק כמו שהיא לא יוצאת בשער. על מסילת הנמל עומדת רכבת אחת בכל פעם, ובשבת רכבות לא נוסעות.');
    const open = S.visits.filter(v => v.phase !== 'DEPARTED');
    const form = `<fieldset><legend>Create train visit</legend><form class="row" data-form="train">
      <label data-tip="שם הרכבת. אפשר לכתוב כל שם.">Train <input name="name" required maxlength="30" value="Inland shuttle ${S.seq.train + 1}"></label>
      <label data-tip="בעוד כמה שעות הרכבת צפויה להגיע לנמל.">ETA in hours <input name="eta" type="number" min="0" max="240" value="1" style="width:60px"></label>
      <label data-tip="כמה קרונות יש לרכבת. בכל קרון מקום ל-40 רגל: מכולה אחת של 40 או שתיים של 20.">Railcars <input name="cars" type="number" min="1" max="8" value="4" style="width:50px"></label>
      <label data-tip="כמה מכולות ייצוא הרכבת מביאה מהארץ. הן ירדו לחצר ויחכו לאונייה שבחרת.">Export boxes on the train <input name="boxes" type="number" min="0" max="16" value="3" style="width:50px"></label>
      <label data-tip="לאיזו אונייה מכולות הייצוא שעל הרכבת מיועדות.">For vessel <select name="visit">${open.map(v => `<option value="${v.id}">${v.id} ${esc(v.vessel)} (${v.phase})</option>`).join('')}</select></label>
      <button data-tip="יוצר ביקור רכבת חדש ברשימה.">Create</button></form></fieldset>`;
    const rows = S.trains.slice().reverse().map(t => {
      const us = Object.values(S.units).filter(u => u.train === t.id);
      let act = '';
      if (t.phase === 'INBOUND') act = `<button class="sm" data-act="trainArrive" data-id="${t.id}">Arrive now</button>`;
      if (t.phase === 'ARRIVED') act = `<button class="sm" data-act="trainStart" data-id="${t.id}">Start work</button>`;
      if (['WORKING', 'COMPLETE'].includes(t.phase)) act = `<button class="sm" data-act="trainDepart" data-id="${t.id}" ${t.phase === 'WORKING' ? 'disabled' : ''}>Depart</button>`;
      if (t.phase !== 'DEPARTED') act += ` <button class="sm" data-act="trainShow" data-id="${t.id}">Show cars</button>`;
      return `<tr class="${UI.train === t.id ? 'sel' : ''}"><td>${t.id}</td><td>${esc(t.name)}</td><td>${tag('ph-' + t.phase, t.phase)}${t.wait ? ` <span class="note">${esc(t.wait)}</span>` : ''}</td><td>${fmt(t.eta)}</td>
        <td>${t.ata != null ? fmt(t.ata) : ''}</td><td>${t.atd != null ? fmt(t.atd) : ''}</td><td class="num">${t.cars}</td>
        <td class="num">${us.filter(u => u.state === 'ON_TRAIN').length}</td><td class="num">${us.filter(u => u.state === 'YARD').length}</td><td>${act}</td></tr>`;
    }).join('');
    const holder = trainHolder();
    const siding = `<p class="siding">${SIDING}: ${holder ? `${esc(holder.name)} (${holder.id}) ${tag('ph-' + holder.phase, holder.phase)}` : '<span class="note">free</span>'}</p>`;
    const table = `<fieldset><legend>Trains</legend>${siding}${S.trains.length ? `<table class="grid"><tr><th>Train visit</th><th>Train</th><th>Phase</th><th>ETA</th><th>ATA</th><th>ATD</th><th class="num">Cars</th><th class="num">Boxes to unload</th><th class="num">Boxes to load</th><th>Actions</th></tr>${rows}</table>` : '<p class="note">No train visits.</p>'}</fieldset>`;
    const live = S.trains.filter(t => t.phase !== 'DEPARTED');
    const t = live.find(x => x.id === UI.train) || holder || live[0];
    if (!t) return head + form + table;
    UI.train = t.id;
    // the consist: one box per car, the boxes on it drawn by size (meaning in text as well as colour)
    const onCar = Object.values(S.units).filter(u => u.train === t.id && u.car && ['ON_TRAIN', 'LOADED', 'YARD'].includes(u.state));
    const cars = Array.from({ length: t.cars }, (_, i) => {
      const c = carNo(i + 1), all = onCar.filter(u => u.car === c);
      // a car still carrying inbound boxes shows them; the imports planned for it go on after it is emptied
      const inbound = all.filter(u => u.state === 'ON_TRAIN'), later = inbound.length ? all.filter(u => u.state === 'YARD') : [];
      const here = inbound.length ? inbound : all;
      const feet = here.reduce((n, u) => n + Number(sizeOf(u)), 0);
      const boxes = here.map(u => `<span class="rbox s${sizeOf(u)} ${u.state === 'YARD' ? 'planned' : u.category}">${u.id.slice(4, 10)}<br>${sizeOf(u)}' ${u.state === 'YARD' ? 'plan' : u.category.slice(0, 3)}</span>`).join('') +
        (feet < RAIL_CAR_FT ? `<span class="rbox free s${RAIL_CAR_FT - feet === 40 ? '40' : '20'}"></span>` : '');
      const tip = `קרון ${c} של ${t.name}: ${here.length ? here.map(u => `${u.id} (${sizeOf(u)} רגל, ${u.state === 'ON_TRAIN' ? 'ייצוא שהגיע ברכבת ומחכה לפריקה' : u.state === 'LOADED' ? 'יבוא שכבר הועמס ויוצא לארץ' : 'יבוא שמתוכנן לעלות לכאן'})`).join(', ') : 'ריק'}. מקום פנוי: ${RAIL_CAR_FT - feet} רגל.` +
        (later.length ? ` אחרי שיורידו את הייצוא, יעלו לקרון הזה: ${later.map(u => u.id).join(', ')}.` : '');
      return `<div class="car" data-tip="${esc(tip)}"><b>Car ${c}${later.length ? ` &middot; then ${later.length} import${later.length > 1 ? 's' : ''}` : ''}</b><div class="cslots">${boxes}</div></div>`;
    }).join('');
    const booked = Object.values(S.units).filter(u => u.train === t.id && u.category === 'IMPORT');
    const canBook = ['INBOUND', 'ARRIVED'].includes(t.phase);
    const brow = u => `<tr><td>${unitLink(u.id)}</td><td>${u.iso} <span class="note">${ISO[u.iso]}</span></td><td class="mono">${posLabel(u)}</td><td>${u.holds.map(h => tag('st-HOLD', h)).join(' ')}</td><td>${u.wi || ''}</td>`;
    const bookedRows = booked.map(u => brow(u) + `<td>${canBook ? `<button class="sm" data-act="trainUnbook" data-id="${t.id}:${u.id}">Unbook</button>` : ''}</td></tr>`).join('');
    const ready = canBook ? Object.values(S.units).filter(railReady) : [];
    const readyRows = ready.map(u => brow(u) + `<td><button class="sm" data-act="trainBook" data-id="${t.id}:${u.id}">Book to ${t.id}</button></td></tr>`).join('');
    const cols = '<tr><th>Unit</th><th>Type</th><th>Position</th><th>Holds</th><th>Open WI</th><th>Actions</th></tr>';
    return head + form + table +
      `<fieldset><legend>Train consist &ndash; ${t.id} ${esc(t.name)} (${t.cars} cars)</legend><div class="baywrap"><div class="cars">${cars}</div></div>
        <div class="legend"><span><i style="background:var(--exp)"></i>Export arriving by rail</span><span><i style="background:var(--imp)"></i>Import loaded, leaving by rail</span><span><i class="lg-rplan"></i>Import planned for this car</span></div></fieldset>
      <fieldset><legend>Imports booked to leave by ${t.id}</legend>${booked.length ? `<table class="grid">${cols}${bookedRows}</table>` : '<p class="note">None booked.</p>'}</fieldset>` +
      (canBook ? `<fieldset><legend>Imports in the yard that could leave by rail</legend>${ready.length ? `<table class="grid">${cols}${readyRows}</table>` : '<p class="note">None.</p>'}</fieldset>` : '');
  },
  work() {
    const groups = ['DISCHARGE', 'LOAD', 'GATE_IN', 'GATE_OUT', 'RAIL_DISCH', 'RAIL_LOAD'];
    const showDone = UI.showDone;
    return header('Work Queues', 'Work instructions in work queues, dispatched to the Equipment Control System (ECS)',
      'כל תנועה של מכולה היא "הוראת עבודה". ההוראה מחכה בתור (PLANNED), המערכת שולחת אותה לציוד פנוי (DISPATCHED), והציוד מבצע (COMPLETE). פריקה צריכה עגורן רציף + רכב אוטונומי + עגורן חצר. פריקה והעמסה של רכבת צריכות עגורן רכבת + עגורן חצר. אם חסר ציוד פנוי, ההוראה מחכה, ורואים למה בעמודה Note.') +
      `<p><label><input type="checkbox" data-act="showDone" ${showDone ? 'checked' : ''}> Show completed</label></p>` +
      '<p class="note">Rail moves need the rail crane RMG01 + a yard crane (no AGV): the siding is on the land side of the yard.</p>' +

// overview map: sea, the two quays drawn to scale, the AGV lane, the 4 blocks with their ASCs, the rail siding
function layoutPanel() {
  const PX = 1.6;   // pixels per scaled metre
  const quays = QUAYS.map(q => {
    const v = quayHolder(q.id);
    const waiting = S.visits.filter(x => x.quay === q.id && x.wait).length;
    return `<div class="quay" style="width:${Math.round(q.len * PX)}px"><b>Quay ${q.id}</b> <span class="note">${q.real} m real, ${q.len} m here</span>
      <div>${v ? esc(v.vessel) + ' ' + tag('ph-' + v.phase, v.phase) : '<span class="note">free</span>'}${waiting ? ` <span class="note">(${waiting} waiting)</span>` : ''}</div></div>`;
  }).join('');
  const qcs = S.eq.filter(e => e.type === 'QC').map(e => `<span class="eqname">${e.id}</span> ${eqStatus(e)}${e.vessel ? ' &rarr; ' + e.vessel : ''}`).join(' ');
  const agvs = S.eq.filter(e => e.type === 'AGV').map(e => `<span class="eqname">${e.id}</span> ${eqStatus(e)}`).join(' ');
  const blocks = BLOCKS.map(b => {
    const used = Object.keys(S.stacks).filter(k => k[0] === b.id).reduce((n, k) => n + S.stacks[k].length, 0);
    return `<div class="lblock"><b>Block ${b.id}</b> <span class="note">${b.use.join(' + ')}, ${used}/${b.bays * b.rows * MAX_TIER}</span>` +
      S.eq.filter(e => e.type === 'ASC-' + b.id).map(e => `<div class="mono"><span class="eqname">${e.id}</span> ${eqStatus(e)}</div>`).join('') + '</div>';
  }).join('');
  return `<fieldset><legend>Terminal layout &ndash; Ashdod South Port, scaled down x4</legend><div class="layout">
    <div class="sea">Sea</div><div class="quays">${quays}</div>
    <div class="lane"><span class="mono">Quay cranes: ${qcs}</span><span class="mono">AGV lane: ${agvs}</span></div>
    <div class="lblocks">${blocks}</div>
    <div class="rail">${railLine()}</div></div>

function visitTable(list, actions) {
  return `<table class="grid"><tr><th>Visit</th><th>Vessel</th><th>Line</th><th>Quay</th><th>Phase</th><th>ETA</th><th>ATA</th><th>ATD</th><th class="num">To discharge</th><th class="num">To load</th><th>QCs</th><th>Plan</th>${actions ? '<th>Actions</th>' : ''}</tr>` +
    list.map(v => {
      const us = Object.values(S.units).filter(u => u.visit === v.id);
      const disch = us.filter(u => u.category === 'IMPORT' && u.state === 'ON_VESSEL').length;
      const load = us.filter(u => u.category === 'EXPORT' && ['YARD', 'AT_GATE'].includes(u.state)).length;
      let act = '';
      if (actions) {
        if (v.phase === 'INBOUND') act = `<button class="sm" data-act="arrive" data-id="${v.id}">Arrive now</button>`;
        if (v.phase === 'ARRIVED') act = `<button class="sm" data-act="start" data-id="${v.id}">Start work</button>`;
        if (v.phase === 'COMPLETE' || v.phase === 'WORKING') act = `<button class="sm" data-act="depart" data-id="${v.id}" ${v.phase === 'WORKING' ? 'disabled title="Finish work first"' : ''}>Depart</button>`;
        if (v.phase !== 'DEPARTED') act += ` <button class="sm" data-act="stowOpen" data-id="${v.id}">Stowage plan</button>`;
      }
      let planTxt = 'not planned';
      if (v.plan) {

// ---------- truck appointments (version 8) ----------
const slotLabel = m => `${fmt(m)}-${fmt(m + 60).slice(-5)}`;
const apptUsed = m => S.appts.filter(a => a.slot === m && a.status !== 'CANCELLED').length;
// the next n hours a truck can still book: the gate is open when the hour starts, and the hour is not over yet
function apptSlots(n) {
  const out = [];
  for (let m = S.clock - S.clock % 60; out.length < n && m < S.clock + 8 * 1440; m += 60) if (isGateOpen(m) && m + 60 > S.clock) out.push(m);
  return out;
}
// imports a truck can come for: in the yard, no move planned, not booked to a train, no pickup booked yet (a held box can be booked; the gate refuses it)
const apptPickups = () => Object.values(S.units).filter(u => u.state === 'YARD' && !u.wi && u.category !== 'EXPORT' && !u.train &&
  !S.appts.some(a => a.status === 'BOOKED' && a.unit === u.id));
function addAppt(kind, slot, unitId) {
  const a = { id: 'AP' + String(++S.seq.appt).padStart(4, '0'), kind, slot, unit: unitId, truck: 'TRK-' + (100 + ++S.seq.truck), status: 'BOOKED', made: S.clock, tx: null };
  S.appts.push(a);
  log('GATE', `Appointment ${a.id} booked: ${a.truck} to ${APPT_KINDS[kind].toLowerCase()}${unitId ? ' ' + unitId : ''}, ${slotLabel(slot)}`);
  return a;
}
// empty when the truck is on time for its appointment, else why not
function apptLate(a) {
  if (S.clock < a.slot - APPT_GRACE) return `Too early for appointment ${a.id} (${slotLabel(a.slot)}): the truck may come from ${fmt(a.slot - APPT_GRACE).slice(-5)}`;
  if (S.clock > a.slot + 60 + APPT_GRACE) return `Too late for appointment ${a.id} (${slotLabel(a.slot)}): the window closed at ${fmt(a.slot + 60 + APPT_GRACE).slice(-5)}`;
  return '';
}
// the gate checks the truck's appointment: none, booked for something else, too early or too late -> turned away.
// Returns true when the truck was turned away. With the rule off any truck may come, and an on-time appointment is still used.
function apptRefused(want, txKind, unitId, a) {
  if (!S.apptRule.required) return false;
  const why = !a ? 'No appointment' : a.kind !== want ? `Appointment ${a.id} is to ${APPT_KINDS[a.kind].toLowerCase()}, not to ${APPT_KINDS[want].toLowerCase()}` : apptLate(a);
  if (!why) return false;
  if (a && S.clock > a.slot + 60 + APPT_GRACE) a.status = 'MISSED';
  const tx = { id: 'TX' + String(++S.seq.tx).padStart(4, '0'), time: S.clock, truck: a ? a.truck : 'TRK-' + (100 + ++S.seq.truck), kind: txKind, unit: unitId,
    status: 'REJECTED', reason: why, appt: a ? a.id : null };
  S.gate.push(tx);
  log('GATE', `${tx.truck} REJECTED: ${why}`);
  flash('err', `Truck ${tx.truck} rejected: ${why}.` + (a ? '' : ' Every truck needs an appointment: book an hour on Truck Appointments first.'));
  return true;
}
function useAppt(a, tx) {
  if (!a || apptLate(a)) return;
  a.status = 'USED'; a.tx = tx.id; tx.appt = a.id; tx.truck = a.truck;
}
// outside gate hours the truck is turned away and nothing else changes (no unit is created)
function gateClosed(kind, unitId) {
  const tx = { id: 'TX' + String(++S.seq.tx).padStart(4, '0'), time: S.clock, truck: 'TRK-' + (100 + ++S.seq.truck), kind, unit: unitId,
    status: 'REJECTED', reason: 'Gate closed until ' + fmt(nextGateOpen(S.clock)) };
  S.gate.push(tx);
  log('GATE', `${tx.truck} REJECTED: ${tx.reason}`);
  flash('err', `Truck ${tx.truck} rejected: the gate is closed now (Sun-Thu 05:00-24:00, Fri 05:00-14:45, Sat closed). It opens ${fmt(nextGateOpen(S.clock))}.`);
}
const FORMS = {

    for (const k of ['lift', 'gateFee', 'storagePerDay', 'freeDays']) S.tariff[k] = Math.max(0, Number(f[k]) || 0);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.act !== 'nav' && el.dataset.act !== 'unit') UI.msg = null;
  ACTIONS[el.dataset.act](el.dataset.id);
  syncTransit(); save(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('nav a, .menubar a')) e.target.click();
  if (e.key === 'Escape') hideTip();
});

function tipText(el) {
  if (el.dataset.tip) return el.dataset.tip;
  if (el.dataset.act) { const t = TIPS[el.dataset.act]; return typeof t === 'function' ? t(el) : t; }
  return infoTip(el);
}
// every heading, column, status tag and screen part explains itself: looked up by its text (exact, else longest prefix)
const INFO_SEL = 'th, .tag, legend, .kpi, .legend span, h3, .lblock, .quay, .sea, .rail, .siding,.lane > span, .eqname, .pstatus, .pick, .tstep, .blbl, .bbar, .bday, .btick, .bshab, .bnow';
function infoTip(el) {
  const txt = (el.matches('.kpi') ? el.querySelector('span').textContent : el.textContent).trim();
  const dict = INFO[el.matches('th') ? 'th' : el.matches('.tag') ? 'tag' : 'part'];
  if (txt in dict) return dict[txt];
  const k = Object.keys(dict).filter(k => k && txt.startsWith(k)).sort((a, b) => b.length - a.length)[0];
  return k ? dict[k] : '';
}

let tipFor = null;
function showTip(el) {
  const text = PREFS.tips && tipText(el);
  if (!text) return hideTip();
  const tip = $('tip');
  tip.textContent = text;
  tip.hidden = false;
  tipFor = el;
  el.setAttribute('aria-describedby', 'tip');
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const left = Math.min(Math.max(4, r.left), innerWidth - w - 4);
  const top = r.bottom + 6 + h > innerHeight ? r.top - h - 6 : r.bottom + 6;
  tip.style.left = left + 'px';
  tip.style.top = Math.max(4, top) + 'px';
}
function hideTip() {
  $('tip').hidden = true;
  if (tipFor) tipFor.removeAttribute('aria-describedby');
  tipFor = null;
}

document.addEventListener('focusout', hideTip);
document.addEventListener('scroll', hideTip, true);

  e.preventDefault();
  const form = e.target;
  UI.msg = null;

});
